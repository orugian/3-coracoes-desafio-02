<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3C Conecta: plataforma de pedidos de exportação da 3corações, com plano de carga em 3D, importação de pedidos por Excel assistente Xica e arquivo pronto para upload no Sirius/SAP.">
<title>3C Conecta</title>
<style>body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho branco leve; catálogo em lista única à esquerda, painel de embarque fixo à direita. Vermelho 3corações só como acento. */
:root{
  --bg:#ECE7E1; --surface:#FFFFFF; --surface-2:#F5F1EC; --surface-3:#E4DDD5; --ink:#211C18; --muted:#615851; --faint:#857A71; --line:#E3DCD4;
  --gold:#FE5C16; --gold-ink:#FFFFFF; --gold-soft:#FFEDE3; --coffee:#2A2D33;
  --accent-text:#C2410C; --sel:#FFF6F0; --sel-line:#FFD9C2;
  --red:#FE5C16; --red-hover:#E24D0C; --red-soft:#FFF0E8; --on-red:#FFFFFF;
  --ok:#1F7A45; --ok-soft:#E5F3EA; --warn:#A35F00; --warn-soft:#FFF4DE; --err:#D0261B; --err-soft:#FDECEA;
  --f-cafe:#6B3A1A; --f-capp:#C08A5B; --f-sol:#E39A2D; --f-filtro:#738A55; --f-porta:#57709A;
  --shadow:0 1px 2px rgba(45,30,20,.06),0 6px 18px rgba(45,30,20,.07);
  --font:"Jost","Century Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D21; --surface-2:#23272C; --surface-3:#2F343A; --ink:#F1F3F5; --muted:#A7AEB7; --faint:#6D747D; --line:#2A2E34;
  --gold:#FF7A3D; --gold-ink:#FFFFFF; --gold-soft:#3D2014; --coffee:#0B0C0E;
  --accent-text:#FF8A57; --sel:#2A2320; --sel-line:#4A3328;
  --red:#FF7A3D; --red-hover:#FF9361; --red-soft:#33231C; --on-red:#FFFFFF;
  --ok:#5BC488; --ok-soft:#16301F; --warn:#F0AE4A; --warn-soft:#33260F; --err:#FF6B61; --err-soft:#3A1715;
  --f-cafe:#B07752; --f-capp:#D8A57A; --f-sol:#F0A84A; --f-filtro:#9DB27A; --f-porta:#86A0C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D21; --surface-2:#23272C; --surface-3:#2F343A; --ink:#F1F3F5; --muted:#A7AEB7; --faint:#6D747D; --line:#2A2E34;
  --gold:#FF7A3D; --gold-ink:#FFFFFF; --gold-soft:#3D2014; --coffee:#0B0C0E;
  --accent-text:#FF8A57; --sel:#2A2320; --sel-line:#4A3328;
  --red:#FF7A3D; --red-hover:#FF9361; --red-soft:#33231C; --on-red:#FFFFFF;
  --ok:#5BC488; --ok-soft:#16301F; --warn:#F0AE4A; --warn-soft:#33260F; --err:#FF6B61; --err-soft:#3A1715;
  --f-cafe:#B07752; --f-capp:#D8A57A; --f-sol:#F0A84A; --f-filtro:#9DB27A; --f-porta:#86A0C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);overflow-x:clip}
body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:0}
.label{font-size:12px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:6px;background:var(--red);display:grid;place-items:center;flex:none}
.mark svg{width:19px;height:19px}
.brand > div{display:flex;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.brand > .mark{display:grid;place-items:center}
@media (max-width:640px){.out span,.out{font-size:0;gap:0}.out svg{width:18px;height:18px}}
.brand b{font-size:18px;font-weight:600;letter-spacing:.01em}
.proto{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,15,.12)}
.seg.sm button{padding:5px 10px;font-size:12px}
.seg.full{width:100%}.seg.full button{flex:1;padding:7px 6px}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.view{display:grid;gap:24px}

/* ---------- hero ---------- */
.hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:30px;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--muted);max-width:56ch}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent-text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.client{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);min-width:0;max-width:100%}
.avatar{width:40px;height:40px;border-radius:8px;background:var(--red-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;flex:none}
.client select{border:0;background:transparent;font-weight:700;font-size:14px;padding:0;max-width:100%;cursor:pointer}
.client .sub{font-size:12px;color:var(--muted)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
@media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card-pad{padding:20px}

/* ---------- catálogo ---------- */
.cat-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 20px 12px}
.cat-top h2{font-size:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:6px;padding:0 12px;height:38px;flex:1 1 220px;max-width:320px}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.search input{border:0;background:transparent;outline:0;width:100%;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 14px;border-bottom:1px solid var(--line)}
.pill{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.pill .n{font-size:11.5px;opacity:.65;font-variant-numeric:tabular-nums}
.pill:hover{background:var(--surface-2);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--red);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.prod{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:6px 18px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);transition:background .15s}
.prod:last-child{border-bottom:0}
.prod.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--red)}
.prod.blocked{opacity:.55}
.tile{width:64px;height:64px;border-radius:8px;display:grid;place-items:center}
.tile svg{width:24px;height:24px}
.prod h3{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.prod .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.price{text-align:right}
.price b{font-size:15px;font-weight:700}
.price span{display:block;font-size:11.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:6px;padding:3px}
.stepper button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;font-size:17px;font-weight:600;color:var(--muted);display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:var(--surface);color:var(--ink)}
.stepper input{width:64px;height:30px;border:0;background:transparent;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;outline:0}
.stepper input::placeholder{color:var(--faint);font-weight:500}
.prod-foot{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;margin-top:4px}
.pbar{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.pbar i{width:10px;height:14px;border-radius:2px;background:var(--surface-3);position:relative;overflow:hidden;display:block}
.pbar i span{position:absolute;inset:auto 0 0 0;display:block}
.note{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.note::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.note.ok{color:var(--ok)}.note.warn{color:var(--warn)}.note.err{color:var(--err)}
.link{border:0;background:transparent;padding:0;color:var(--accent-text);font-weight:700;font-size:12.5px}
.link:hover{text-decoration:underline}
@media (max-width:640px){
  .prod{grid-template-columns:44px minmax(0,1fr);padding:14px 16px}
  .tile{width:44px;height:44px}
  .price{text-align:left;grid-column:2}
  .stepper{grid-column:2;justify-self:start}
  .prod-foot{grid-column:1/-1}
}

/* ---------- painel embarque ---------- */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:1040px){.panel{position:static}}
.p-sec{padding:18px 20px;display:grid;gap:12px}
.p-sec + .p-sec{border-top:1px solid var(--line)}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p-head h2{font-size:18px}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:var(--red)}
.switch input:checked::after{left:16px}
.status{display:flex;align-items:center;gap:12px}
.ring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring svg{width:18px;height:18px}
.status b{display:block;font-size:16px;letter-spacing:-.01em}
.status small{font-size:12.5px;color:var(--muted)}
.st-full .ring{background:var(--ok-soft);color:var(--ok)}
.st-partial .ring{background:var(--warn-soft);color:var(--warn)}
.st-excess .ring{background:var(--err-soft);color:var(--err)}
.st-empty .ring{background:var(--surface-2);color:var(--faint)}
.st-excess b{color:var(--err)}
.truck{position:relative;background:var(--surface-2);border-radius:8px}
.truck svg{width:100%;height:auto;display:block}
.meters{display:grid;gap:12px}
.meter{display:grid;gap:6px}
.meter .top-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.meter .top-row span:first-child{color:var(--muted);font-weight:500}
.meter .top-row b{font-weight:700}
.meter .bar{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.meter .bar span{display:block;height:100%;border-radius:999px;background:var(--faint)}
.meter .bar.bind span{background:var(--ink)}
.meter .bar.over span{background:var(--err)}
.bindtag{font-size:10.5px;font-weight:700;color:var(--ink);background:var(--surface-2);padding:1px 6px;border-radius:999px;margin-left:4px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;font-size:13px;padding:10px 12px;border-radius:6px;line-height:1.4}
.alert.err{background:var(--err-soft);color:var(--err)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.tip{background:var(--surface-2);color:var(--ink)}
.alert.okb{background:var(--ok-soft);color:var(--ok)}
.alert .ic{width:16px;height:16px;flex:none}
.alert button{margin-left:auto;flex:none;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.value{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat .label{display:block}
.stat b{font-size:15px;font-weight:700;display:block}
.fam{display:grid;gap:6px;font-size:12.5px}
.fam div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.fam span:nth-child(2),.fam span:nth-child(3){text-align:right;color:var(--muted)}
.btn{border:0;border-radius:6px;padding:13px 20px;font-weight:600;letter-spacing:.02em;font-size:14.5px;background:var(--red);color:var(--on-red);width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover:not(:disabled){background:var(--red-hover)}
.btn:disabled{opacity:.4}
.btn.dark{background:var(--coffee);color:#fff}
.btn.sm{width:auto;padding:10px 16px;font-size:13.5px}
.btn-soft{border:0;background:var(--surface-2);border-radius:6px;padding:9px 14px;font-weight:600;font-size:13px}
.btn-soft:hover{background:var(--surface-3)}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,10,8,.45);backdrop-filter:blur(2px);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:calc(100% - 24px);overflow:auto;display:grid;gap:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.x{width:34px;height:34px;border-radius:6px;border:0;background:var(--surface-2);font-size:16px;flex:none}
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.r,table.data th.r{text-align:right}
table.data tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.info b{display:block;font-weight:600}
.field{display:grid;gap:6px}
.field input{border:0;background:var(--surface-2);border-radius:6px;padding:10px 12px;outline:0}
.field input:focus{box-shadow:0 0 0 2px var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.err{background:var(--err-soft);color:var(--err)}.chip.neutral{background:var(--surface-2);color:var(--ink)}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.timeline div{display:grid;gap:8px;font-size:12px;color:var(--faint);font-weight:500}
.timeline div::before{content:"";height:4px;border-radius:999px;background:var(--surface-3)}
.timeline div.done{color:var(--ink);font-weight:700}
.timeline div.done::before{background:var(--red)}
.success{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success svg{width:26px;height:26px}

/* ---------- exportação ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.kpi{padding:18px 20px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi b{display:block;font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.exp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.exp{grid-template-columns:minmax(0,1fr)}}
.olist{display:grid;padding:6px}
.orow{text-align:left;border:0;background:transparent;border-radius:8px;padding:12px 14px;display:grid;gap:4px;width:100%}
.orow:hover{background:var(--surface-2)}
.orow[aria-pressed="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--red)}
.orow .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.orow .id{font-weight:700}
.orow .r3{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h3{font-size:22px}
.callout{background:var(--red-soft);color:var(--ink);border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.5}
.callout b{color:var(--accent-text)}
.mini-in{width:80px;border:0;background:var(--surface-2);border-radius:8px;padding:6px 8px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mini-in:disabled{background:transparent}
pre.csv{background:var(--surface-2);border-radius:8px;padding:14px;font-family:var(--mono);font-size:11.5px;overflow-x:auto;margin:0;white-space:pre;line-height:1.6}
.audit{display:grid}
.audit div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.audit div:last-child{border-bottom:0}
.audit time{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.sec-title{font-size:13px;font-weight:700;margin-bottom:6px}

/* ---------- base ---------- */
td.div{color:var(--err);font-weight:700;background:var(--err-soft)}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;counter-reset:s}
.road div{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:6px;align-content:start}
.road div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.road div.now::before{background:var(--red);color:var(--on-red)}
.road b{font-size:15px}
.road span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.rules{display:grid;gap:8px;font-size:13.5px}
.rules div{display:flex;gap:10px}
.rules div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);margin-top:8px;flex:none}
/* ---------- áreas ---------- */
:root{--admin-bg:#25282D;--admin-fg:#FFFFFF;--admin-muted:rgba(255,255,255,.62);--admin-seg:rgba(255,255,255,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--admin-bg:#0B0C0E}}
:root[data-theme="dark"]{--admin-bg:#0B0C0E}
.top.admin{background:var(--admin-bg);color:var(--admin-fg);border-bottom-color:transparent;backdrop-filter:none}
.top.admin .seg{background:var(--admin-seg)}
.top.admin .seg button{color:var(--admin-muted)}

.home-hero .hh-sum{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.home2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:start}
.home-col{display:grid;gap:20px;min-width:0}
@media (max-width:1040px){.home2{grid-template-columns:minmax(0,1fr)}.home-col{order:-1}}
.hx{padding:0;display:flex;flex-direction:column;gap:0;overflow:hidden;background:var(--surface);border-color:var(--line)}
.hx-main{padding:22px 22px 20px;display:grid;gap:16px;background:linear-gradient(180deg,var(--sel),var(--surface) 70%)}
.hx-top{gap:16px}
.hx-top h3{font-size:19px;margin:3px 0 4px}
.hx-stats{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1.3fr);border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.hx-stats > div{padding:10px 14px;display:grid;gap:2px;min-width:0}
.hx-stats > div + div{border-left:1px solid var(--line)}
.hx-stats span{font-size:11.5px;color:var(--muted);font-weight:500}
.hx-stats b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-items{list-style:none;margin:0;padding:0;display:grid}
.hx-items li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.hx-items li:last-child{border-bottom:0}
.hx-items .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-items b{font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.hx-items .dot{width:10px;height:10px;border-radius:3px}
.hx .btn.hx-cta{width:100%;justify-self:stretch}
.hx-tips{border-top:1px solid var(--line);background:var(--surface-2);padding:16px 22px 18px;display:grid;gap:10px}
.hx-th{display:flex;align-items:center;gap:10px;font-size:14px}
.hx-tips ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.hx-tips li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45}
.hx-tips li svg{width:16px;height:16px;color:var(--accent-text);margin-top:1px}
.hx-more{justify-self:start}
.hc-h{display:flex;align-items:center;gap:12px;padding:18px 20px 14px}
.hc-ic{width:36px;height:36px;border-radius:10px;background:var(--red-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.hc-ic svg{width:18px;height:18px}
.hc-tt{flex:1;min-width:0}
.hc-tt h2{font-size:16.5px;display:flex;align-items:center;gap:8px;margin:0}
.hc-tt > span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.hc-n{font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:1px 8px;line-height:1.5}
.hc-link{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;align-self:center}
.hc-link svg{width:14px;height:14px}
.or-st{display:inline-flex;align-items:center;gap:14px;justify-self:end}
.or-cap{display:inline-flex;align-items:center;gap:8px}
.or-cap i{display:block;width:64px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.or-cap s{display:block;height:100%;border-radius:99px;background:var(--warn)}
.or-cap.ok s{background:var(--ok)}
.or-cap.err s{background:var(--err)}
.or-cap em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);min-width:32px;text-align:right}

/* ============ MOTOR DE CÁLCULO ============ */
function calc(qty,o){
  const vb=VEH[o.veh]||VEH[bigVeh()], v=o.vsnap?{...vb,...o.vsnap,cols:Math.ceil(o.vsnap.pos/2)}:vb, cl=CLIENTS[o.client];
  const lines=[]; const tot={cx:0,pallets:0,net:0,gross:0,m3:0,value:0,positions:0};
  for(const p of P){
    const raw=Math.max(0,qty[p.code]||0); if(raw<EPS) continue;
    const isInt=Math.abs(raw-Math.round(raw))<1e-6; const cx=isInt?Math.round(raw):Math.ceil(raw);
    const pallets=cx/p.cxPal, full=Math.floor(pallets+EPS), frac=pallets-full;
    const hasFrac=frac>EPS;
    const missing=hasFrac?Math.ceil(p.cxPal*(full+1)-cx-EPS):0;
    const price=priceFor(p,o.client);
    const l={p,cx,pallets,full,frac:hasFrac?frac:0,missing,net:cx*p.net,gross:cx*p.gross,m3:cx*p.m3,price,value:cx*price,issues:[]};
    if(!isInt) l.issues.push({lv:"err",k:"boxMult",raw,lo:Math.floor(raw),hi:Math.ceil(raw)});
    if(cl.blocked.includes(p.code)) l.issues.push({lv:"err",k:"blocked"});
    if(p.off) l.issues.push({lv:"err",k:"inactive"});
    if(p.price==null&&!(p.prices&&p.prices[cl.list]!=null)) l.issues.push({lv:"err",k:"noPrice"});
    if(pallets+EPS<p.loteMin) l.issues.push({lv:RULES.minLotBlock?"err":"warn",k:"belowMin",v:p.loteMin});
    if(hasFrac && o.mode==="pal") l.issues.push({lv:RULES.fullPalBlock?"err":"warn",k:"missing",v:missing,n:full+1});
    lines.push(l);
    tot.cx+=cx; tot.pallets+=pallets; tot.net+=l.net; tot.gross+=l.gross; tot.m3+=l.m3; tot.value+=l.value;
    tot.positions+=Math.ceil(pallets-EPS);
  }
  if(o.mixed) tot.positions=Math.ceil(tot.pallets-EPS);
  const u={kg:tot.gross/v.kg, m3:tot.m3/v.m3, pos:o.mode==="pal"?tot.positions/v.pos:0};
  const keys=o.mode==="pal"?["kg","m3","pos"]:["kg","m3"];
  const bind=keys.reduce((a,b)=>u[b]>u[a]?b:a,keys[0]);
  const maxU=u[bind];
  const status=!lines.length?"empty":maxU>1+EPS?"excess":maxU>=RULES.fullAt?"full":"partial";
  const over={pos:o.mode==="pal"?Math.max(0,tot.positions-v.pos):0,kg:Math.max(0,tot.gross-v.kg),m3:Math.max(0,tot.m3-v.m3)};
  const blocking=!lines.length||lines.some(l=>l.issues.some(i=>i.lv==="err"))||status==="excess";
  const fams={}; lines.forEach(l=>{const f=l.p.fam;fams[f]=fams[f]||{kg:0,val:0,pal:0};fams[f].kg+=l.net;fams[f].val+=l.value;fams[f].pal+=l.pallets});
  return {lines,tot,u,bind,status,over,v,blocking,fams,maxU,mode:o.mode,mixed:!!o.mixed,veh:o.veh};
}

/* ============ RASCUNHOS (vários por cliente) ============ */
/* S.qty, S.veh, S.mode e S.unit são a cópia de trabalho do rascunho ativo; syncDraft grava de volta a cada render. */
const newDraftId=()=>"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const myDrafts=()=>S.drafts.filter(d=>d.client===S.client);
const hasItems=d=>Object.keys(d.qty||{}).length>0;
function syncDraft(){const d=S.drafts.find(x=>x.id===S.draftId);if(!d||d.client!==S.client)return;const nq=JSON.stringify(S.qty);if(JSON.stringify(d.qty)!==nq||d.veh!==S.veh||d.mode!==S.mode)d.updated=Date.now();d.qty=JSON.parse(nq);d.unit={...S.unit};d.veh=S.veh;d.mode=S.mode}
function useDraft(id){syncDraft();const d=S.drafts.find(x=>x.id===id);if(!d)return;S.draftId=d.id;S.client=d.client;S.qty={...d.qty};S.unit={...(d.unit||{})};S.veh=vehOn(d.veh)?d.veh:bigVeh();S.mode=d.mode==="est"?"est":"pal"}
function autoDraftName(){const n=myDrafts().length+1;return tr(`Rascunho ${n}`,`Borrador ${n}`,`Draft ${n}`)}
function createDraft(name,qty,veh,mode){
  syncDraft();
  S.drafts=S.drafts.filter(d=>d.client!==S.client||hasItems(d)); /* não acumula rascunhos vazios */
  const d={id:newDraftId(),client:S.client,name:String(name||autoDraftName()).slice(0,40),qty:{...(qty||{})},unit:{},veh:vehOn(veh)?veh:bigVeh(),mode:mode==="est"?"est":"pal",created:Date.now(),updated:Date.now()};
  S.drafts.unshift(d); S.draftId=null; useDraft(d.id); return d;
}
function deleteDraft(id){
  const i=S.drafts.findIndex(x=>x.id===id); if(i<0)return;
  S.drafts.splice(i,1);
  if(S.draftId===id){S.draftId=null;const next=myDrafts().filter(hasItems).sort((a,b)=>b.updated-a.updated)[0];if(next)useDraft(next.id);else createDraft()}
}
function ensureDraft(){
  const cur=S.drafts.find(d=>d.id===S.draftId);
  if(cur&&cur.client===S.client)return;
  if(cur)syncDraftTo(cur);
  const mine=myDrafts().sort((a,b)=>b.updated-a.updated)[0];
  S.draftId=null; if(mine)useDraft(mine.id); else createDraft();
}
/* grava a cópia de trabalho no rascunho de origem quando a conta muda */
function syncDraftTo(d){d.qty={...S.qty};d.unit={...S.unit};d.veh=S.veh;d.mode=S.mode}

function adjCount(o){return o.audit.filter(a=>a.what.startsWith("Alterou")).length}
function firstPass(list){const ap=list.filter(o=>o.status!=="analise");if(!ap.length)return null;return ap.filter(o=>!adjCount(o)).length/ap.length}
function clientKPIs(mine){
  const rs=mine.map(o=>calc(o.qty,o));
  const occ=rs.length?rs.reduce((a,r)=>a+r.maxU,0)/rs.length:0;
  const usd=rs.reduce((a,r)=>a+r.tot.value,0), kg=rs.reduce((a,r)=>a+r.tot.net,0);
  const fp=firstPass(mine);
  return `<div class="kpis">
    <div class="kpi"><span class="label">${t("kOpen")}</span><b class="num">${mine.length}</b></div>
    <div class="kpi"><span class="label">${t("kOcc")}</span><b class="num">${fmt(occ*100,0)}%</b></div>
    <div class="kpi"><span class="label">${t("kBought")}</span><b class="num">${money(usd)}</b><small class="num">${fmt(kg,0)} kg</small></div>
    <div class="kpi ${fp==null?"soon":""}"><span class="label">${t("kFirst")}</span><b class="num">${fp==null?t("kNone"):fmt(fp*100,0)+"%"}</b></div>
  </div>`;
}
function fmtDur(ms){const m=Math.round(ms/60000);if(m<60)return m+" min";const h=Math.floor(m/60);return h+"h "+String(m%60).padStart(2,"0")+"min"}
function journeyHTML(o,r){
  const adj=adjCount(o), st=o.status;
  const steps=[
    {t:o.origin==="Order Basis"?"Pedido importado":"Pedido recebido",w:o.origin==="Order Basis"?"Exportação (planilha)":"Cliente, pelo portal",s:"done",when:o.created},
    {t:"Validação automática",w:"3C Conecta",s:r.blocking?"bad":"done",when:r.blocking?"com bloqueio":"sem bloqueios"},
    {t:"Revisão e ajustes",w:"Analista de Exportação",s:st==="analise"?"now":"done",when:st==="analise"?"em andamento":(adj?adj+" ajuste"+(adj>1?"s":""):"sem ajustes")},
    {t:"Aprovação",w:o.auto?"Regra automática":"Analista de Exportação",s:st==="analise"?"":"done",when:st==="analise"?"aguardando":(o.approved||"aprovado")},
    {t:"Arquivo Sirius/SAP",w:"Upload pelo analista",s:st==="sap"?"done":st==="aprovado"?"now":"",when:st==="sap"?"gerado "+(o.sapAt||""):st==="aprovado"?"pronto para gerar":"após a aprovação"}
  ];
  return `<div class="jr"><div class="sec-title">Jornada do pedido</div><div class="journey j5">${steps.map((x,i)=>`<div class="js ${x.s}"><span class="when">${i+1}. ${x.when||"&nbsp;"}</span><b>${x.t}</b><span class="who">${x.w}</span></div>`).join("")}</div></div>`;
}

/* ---------- kit de tabela: busca, filtros e paginação (escala para milhares de linhas) ---------- */
const TB={};
function tbState(id){return TB[id]=TB[id]||{q:"",page:1,size:10,f:{}}}
function tbSlice(id,arr){const st=tbState(id),pages=Math.max(1,Math.ceil(arr.length/st.size));if(st.page>pages)st.page=pages;return arr.slice((st.page-1)*st.size,st.page*st.size)}
function pager(id,total){const st=tbState(id),pages=Math.max(1,Math.ceil(total/st.size)),from=total?(st.page-1)*st.size+1:0,to=Math.min(total,st.page*st.size);
  return `<div class="pager"><span class="label">${total?`Mostrando ${from} a ${to} de ${total}`:"Nenhum resultado"}</span><div class="pg-ctl"><label class="label">Por página <select data-tbsize="${id}" aria-label="Linhas por página">${[10,25,50].map(n=>`<option ${n===st.size?"selected":""}>${n}</option>`).join("")}</select></label><button class="pg-b" data-tbpage="${id}:${st.page-1}" ${st.page<=1?"disabled":""} aria-label="Página anterior">‹</button><span class="num pg-n">${st.page} de ${pages}</span><button class="pg-b" data-tbpage="${id}:${st.page+1}" ${st.page>=pages?"disabled":""} aria-label="Próxima página">›</button></div></div>`}
function tbSearch(id,ph){return `<label class="search">${SVG.search}<input data-tbq="${id}" value="${esc(tbState(id).q)}" placeholder="${ph}" aria-label="${ph}" autocomplete="off"></label>`}
function tbSelect(id,key,label,opts){const v=tbState(id).f[key]||"";return `<select data-tbf="${id}:${key}" aria-label="${label}">${opts.map(([val,l])=>`<option value="${val}" ${String(val)===String(v)?"selected":""}>${l}</option>`).join("")}</select>`}
function famName(f){return FAM[f]?FAM[f].pt:f}
function famOpts(){return [...new Set(P.map(p=>p.fam))].map(f=>[f,famName(f)])}
function prodCell(p,sub){return `<div class="pc"><span class="dot" style="background:${famColor(p.fam)}"></span><div style="min-width:0">${esc(p.pt)}<div class="code">${sub||p.code}</div></div></div>`}
function initials(n){return String(n).replace(/[^A-Za-zÀ-ÿ ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function langName(c){return {es:"Espanhol",pt:"Português",en:"Inglês"}[c.lang||"es"]}
function listsInfo(){const m={};Object.entries(CLIENTS).forEach(([k,c])=>{(m[c.list]=m[c.list]||{list:c.list,clients:[],factor:c.factor,cur:c.cur}).clients.push(k)});return m}
function listPrice(p,l){if(p.prices&&p.prices[l]!=null)return p.prices[l];if(p.price==null)return null;const L=listsInfo()[l];return Math.round(p.price*(L?L.factor:1)*100)/100}
function srcNote(p){return p.priceSrc==="missing"?'<span class="note err">sem preço</span>':p.priceSrc==="manual"?'<span class="note warn">manual</span>':'<span class="note ok">SAP</span>'}
const CHEV='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- qualidade do cadastro: SAP (fonte usada) x Order Basis (planilha de hoje) ---------- */
const QCAT={kg:"Peso por caixa",pal:"Paletização",price:"Preço",lot:"Lote mínimo"};
function qualityIssues(){
  const out=[], d=(a,b,tol)=>Math.abs(a-b)>(tol||0.011), f=v=>fmtPT(v,v%1?2:0);
  P.forEach(p=>{const o=p.ob;if(!o)return;
    if(d(o.cxPal,p.cxPal))out.push({p,cat:"pal",imp:"carga",t:`Caixas por pallet: a Order Basis usa ${f(o.cxPal)}, mas o SAP tem ${p.cxPal} (${p.lastro} caixas × ${p.alt} camadas).`,use:`${p.cxPal} cx por pallet`});
    if(d(o.palz,p.cxPal))out.push({p,cat:"pal",imp:"carga",t:`A aba de paletização da planilha traz ${f(o.palz)} cx por pallet${o.palz%1?", um valor quebrado":""}; o SAP tem ${p.cxPal}.`,use:`${p.cxPal} cx por pallet`});
    if(p.priceSrc==="manual")out.push({p,cat:"price",imp:"valor",t:`Sem preço vigente no SAP: a Order Basis usa US$ ${fmtPT(o.price)}, digitado à mão.`,use:`US$ ${fmtPT(p.price)} manual, até o SAP ter preço`});
    else if(d(o.price,p.price))out.push({p,cat:"price",imp:"valor",t:`Preço: a Order Basis usa US$ ${fmtPT(o.price)}, mas o SAP tem US$ ${fmtPT(p.price)}.`,use:`US$ ${fmtPT(p.price)}`});
    if(d(o.lote,p.loteMin))out.push({p,cat:"lot",imp:"carga",t:`Lote mínimo: a Order Basis pega ${f(o.lote)}, o primeiro valor que encontra (filial BHO); para Londrina o SAP tem ${f(p.loteMin)} pallet${p.loteMin>1?"s":""}.`,use:`${f(p.loteMin)} pallet${p.loteMin>1?"s":""}`});
    if(d(o.grossCx,p.gross,0.05)){const r=o.grossCx/p.gross;
      out.push({p,cat:"kg",imp:"carga",t:r>3?`Peso bruto por caixa: a Order Basis usa ${fmtPT(o.grossCx,2)} kg, quase ${Math.round(r)} vezes o do SAP (${fmtPT(p.gross,2)} kg). A unidade cadastrada é o display, não o stick.`:o.grossCx<p.gross?`Peso bruto por caixa: a Order Basis usa ${fmtPT(o.grossCx,2)} kg porque soma só o produto e ignora a caixa de papelão; o SAP tem ${fmtPT(p.gross,2)} kg.`:`Peso bruto por caixa: a Order Basis usa ${fmtPT(o.grossCx,2)} kg, mas o SAP tem ${fmtPT(p.gross,2)} kg.`,use:`${fmtPT(p.gross,2)} kg por caixa`})}
  });
  return out;
}

/* Monta os pallets do pedido: cheios primeiro, depois as sobras (juntas só se o cliente aceita pallet misto). */
function palletUnits(r){
  const units=[]; if(r.mode!=="pal") return units;
  r.lines.forEach(l=>{for(let i=0;i<l.full;i++)units.push([{f:1,p:l.p}])});
  const fr=r.lines.filter(l=>l.frac>EPS).map(l=>({f:l.frac,p:l.p}));
  if(r.mixed){let cur=[],acc=0;fr.forEach(x=>{let rem=x.f;while(rem>1e-6){const take=Math.min(rem,1-acc);cur.push({f:take,p:x.p});acc+=take;rem-=take;if(acc>=1-1e-6){units.push(cur);cur=[];acc=0}}});if(cur.length)units.push(cur)}
  else fr.forEach(x=>units.push([x]));
  return units;
}
function truckBox(r,kind){
  const tx=k=>(kind==="adm"?T.pt:T[S.lang])[k];
  const units=palletUnits(r), out=r.mode==="pal"?Math.max(0,units.length-r.v.pos):0;
  const can=v3Supported(), on=can&&S.view3d!=="2d";
  const tag=out?`<span class="v3d-tag">${tx("v3dOut")(out)}</span>`:(r.mode==="est"&&r.u.m3>1+EPS?`<span class="v3d-tag">${tx("st_excess")}</span>`:"");
  return `<div class="truck ${on?"is3d":""}" data-truck>
    ${can?`<div class="v3d ${kind}" data-v3d="${kind}"><div class="v3d-ui"><button class="v3d-btn" data-view3d="2d" title="${tx("view2d")}" aria-label="${tx("view2d")}">2D</button><button class="v3d-btn" data-v3big="${kind}" title="${tx("v3dExpand")}" aria-label="${tx("v3dExpand")}">${SVG.expand}</button></div>${tag}${V3.hinted?"":`<span class="v3d-hint">${tx("v3dHint")}</span>`}</div>`:""}
    <div class="t2d">${truckSVG(r)}${can?`<button class="v3d-btn t3" data-view3d="3d" title="3D" aria-label="3D">3D</button>`:""}</div>
  </div>`;
}
function truckSVG(r){
  const v=r.v, cols=v.cols, cw=30, ch=26, gap=3, padX=v.cab?52:4, padY=4;
  const trailerW=cols*(cw+gap)+gap, trailerH=2*(ch+gap)+gap;
  const units=palletUnits(r).map(u=>u.map(s=>({f:s.f,c:famColor(s.p.fam)})));
  const extra=Math.max(0,units.length-v.pos), extraCols=Math.ceil(extra/2);
  const W=padX+trailerW+(extraCols?extraCols*(cw+gap)+14:0)+4, H=trailerH+padY*2+(extra?14:0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("positions")}: ${r.tot.positions}/${v.pos}">`;
  if(v.cab)s+=`<rect x="4" y="${padY+5}" width="40" height="${trailerH-10}" rx="10" fill="var(--surface)" stroke="var(--surface-3)" stroke-width="1.5"/><rect x="9" y="${padY+11}" width="10" height="${trailerH-22}" rx="3" fill="var(--surface-3)"/>`;
  s+=`<rect x="${padX}" y="${padY}" width="${trailerW}" height="${trailerH}" rx="6" fill="var(--surface)" stroke="var(--surface-3)" stroke-width="1.5"/>`;
  if(r.mode==="est"){
    const fillW=Math.min(1,r.u.m3)*(trailerW-6); let x=padX+3; const tot=r.tot.m3||1;
    r.lines.forEach(l=>{const w=fillW*(l.m3/tot);s+=`<rect x="${x}" y="${padY+3}" width="${Math.max(0,w)}" height="${trailerH-6}" fill="${famColor(l.p.fam)}"/>`;x+=w});
    for(let gx=padX+3+10;gx<padX+3+fillW;gx+=10)s+=`<line x1="${gx}" y1="${padY+3}" x2="${gx}" y2="${padY+trailerH-3}" stroke="var(--surface)" stroke-opacity=".5"/>`;
  } else {
    for(let i=0;i<Math.max(v.pos,units.length);i++){
      const inside=i<v.pos, col=inside?Math.floor(i/2):Math.floor((i-v.pos)/2), row=i%2;
      const x=inside?padX+gap+col*(cw+gap):padX+trailerW+14+col*(cw+gap), y=padY+gap+row*(ch+gap);
      s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="3" fill="${inside?"var(--surface-2)":"none"}" ${inside?"":'stroke="var(--err)" stroke-dasharray="3 2" stroke-width="1.5"'}/>`;
      const u=units[i]; if(u){let yy=y+ch;u.forEach(seg=>{const h=ch*seg.f;yy-=h;s+=`<rect x="${x}" y="${yy}" width="${cw}" height="${h}" rx="${seg.f>.95?3:1}" fill="${seg.c}" ${inside?"":'opacity=".45"'}/>`})}
    }
    if(extra)s+=`<text x="${padX+trailerW+14}" y="${H-1}" font-size="10" font-weight="700" font-family="var(--font)" fill="var(--err)">+${extra}</text>`;
  }
  return s+`</svg>`;
}

function meter(label,val,cap,unit,u,isBind,d=0){
  const pct=Math.min(u,1)*100, over=u>1+EPS;
  return `<div class="meter"><div class="top-row"><span>${label}${isBind?`<span class="bindtag">${t("bind")}</span>`:""}</span><span class="num"><b style="${over?"color:var(--err)":""}">${fmt(val,d)}</b> / ${fmt(cap,d)} ${unit}</span></div>
  <div class="bar ${over?"over":isBind?"bind":""}"><span style="width:${pct}%"></span></div></div>`;
}

function suggestions(r){
  const out=[]; if(!r.lines.length||S.mode!=="pal") return out;
  const v=r.v;
  if(r.status==="excess"&&r.over.pos>0){
    const big=[...r.lines].sort((a,b)=>b.pallets-a.pallets)[0];
    out.push({txt:t("sugCut")(r.over.pos,big.p[S.lang]),act:`cut:${big.p.code}:${r.over.pos}`});
  } else if(r.status!=="excess"){
    const free=v.pos-r.tot.positions;
    if(r.lines.some(l=>l.frac>EPS)) out.push({txt:t("sugRound"),act:"round"});
    else if(free>=1){
      const ok=r.lines.filter(l=>!l.p.off&&!CLIENTS[S.client].blocked.includes(l.p.code)).sort((a,b)=>b.cx-a.cx);
      for(const l of ok){const add=free*l.p.cxPal;if(r.tot.gross+add*l.p.gross<=v.kg&&r.tot.m3+add*l.p.m3<=v.m3){out.push({txt:t("sugAdd")(free,l.p[S.lang]),act:`add:${l.p.code}:${free}`});break}}
    }
  }
  return out;
}

function blockersOf(r){
  const out=[]; if(r.over.pos)out.push(t("errPos")(r.over.pos)); if(r.over.kg)out.push(t("errKg")(fmt(r.over.kg,0))); if(r.over.m3)out.push(t("errM3")(fmt(r.over.m3,1)));
  r.lines.forEach(l=>l.issues.filter(i=>i.lv==="err").forEach(i=>out.push(`${l.p[S.lang]||l.p.pt}: ${issueText(l,i)}`))); return out;

async function saveFile(name,text){
  try{if(window.claude&&typeof window.claude.use==="function"){const d=await window.claude.use("downloads");if(d){await d.save({filename:name,data:text});toast("Arquivo salvo: "+name);return}}}

  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast("Arquivo baixado: "+name)}catch(_){toast("Use Copiar e cole no Sirius","err")}
}
function buildOB(o,r){

function buildCSV(o,r){

/* ============ PARÂMETROS DO NEGÓCIO (painel 3corações) ============ */
/* Edição em rascunho: nada muda até "Salvar e aplicar". Antes de salvar, o painel mostra o impacto nos pedidos em análise.
   A mesma validação (pvalidate) roda na tela e na API, como faria o servidor. */
const PFIELD={
  "rules.fullAt":{min:0.5,max:1,label:"Carga completa",scale:100,unit:"%"},
  "rules.leadDays":{min:0,max:60,int:true,label:"Prazo mínimo de carregamento",unit:"dias"},
  "rules.lateH":{min:1,max:72,label:"Alerta de fila",unit:"h"},
  "veh.*.pos":{min:1,max:60,int:true,label:"Posições de pallet"},
  "veh.*.kg":{min:500,max:60000,label:"Peso máximo",unit:"kg"},
  "veh.*.m3":{min:1,max:150,label:"Cubagem",unit:"m³"},
  "prod.*.lastro":{min:1,max:60,int:true,label:"Lastro"},
  "prod.*.alt":{min:1,max:30,int:true,label:"Camadas"},
  "prod.*.loteMin":{min:0,max:50,label:"Lote mínimo",unit:"pallets"},
  "prod.*.gross":{min:0.01,max:100,label:"Peso bruto por caixa",unit:"kg"}
};
const PBOOL=new Set(["rules.minLotBlock","rules.fullPalBlock"]);
function pfield(path){const [a,,c]=path.split(".");return PFIELD[path]||PFIELD[a+".*."+c]}
function pvalidate(path,v){
  const [a,b,c]=String(path).split(".");
  if(a==="veh"&&b!=="__new"&&!VEH[b])return "Veículo não encontrado";
  if(a==="prod"&&!BY[b])return "Produto não encontrado";
  if(a==="block")return CLIENTS[b]&&BY[c]?(typeof v==="boolean"?"":"Valor inválido"):"Cadastro não encontrado";
  if(PBOOL.has(path)||(a==="veh"&&c==="active")||(a==="prod"&&c==="off"))return typeof v==="boolean"?"":"Valor inválido";
  if(a==="veh"&&["pt","es","en"].includes(c))return typeof v==="string"&&v.trim()&&v.trim().length<=40?"":"Informe um nome com até 40 caracteres";
  if(a==="veh"&&c==="kind")return v==="trailer"||v==="container"?"":"Tipo inválido";
  if(a==="rules"&&!(b in RULES_DEF))return "Regra desconhecida";
  const f=pfield(path); if(!f)return "Parâmetro desconhecido";
  if(typeof v!=="number"||!isFinite(v))return `${f.label}: informe um número`;
  if(f.int&&!Number.isInteger(v))return `${f.label}: use um número inteiro`;
  const sc=f.scale||1;
  if(v<f.min-1e-9||v>f.max+1e-9)return `${f.label}: entre ${nf(f.min*sc)} e ${nf(f.max*sc)}${f.unit?" "+f.unit:""}`;
  return "";
}
function pget(path){const [a,b,c]=path.split(".");
  if(a==="rules")return RULES[b];
  if(a==="veh")return c==="active"?VEH[b].active!==false:c==="kind"?(VEH[b].kind||"trailer"):VEH[b][c];
  if(a==="prod")return c==="off"?!!BY[b].off:BY[b][c];
  if(a==="block")return CLIENTS[b].blocked.includes(c);
}
function pset(path,v){const [a,b,c]=path.split(".");
  if(a==="rules")RULES[b]=v;
  else if(a==="veh"){const x=VEH[b];x[c]=v;if(c==="pos")x.cols=Math.ceil(v/2);if(c==="kind")x.cab=v==="trailer"}
  else if(a==="prod"){const p=BY[b];p[c]=v;if(c==="lastro"||c==="alt")p.cxPal=p.lastro*p.alt}
  else if(a==="block"){const cl=CLIENTS[b];cl.blocked=cl.blocked.filter(x=>x!==c);if(v)cl.blocked.push(c)}
}
const psame=(a,b)=>typeof a==="number"&&typeof b==="number"?Math.abs(a-b)<1e-9:a===b;
const pv=(path,cur)=>path in S.pd?S.pd[path]:cur;
function pdesc(x){const [a,b,c]=x.p.split(".");
  if(a==="rules"){const L={fullAt:"carga completa a partir de",leadDays:"prazo mínimo de carregamento",lateH:"alerta de pedido parado na fila",minLotBlock:"lote mínimo",fullPalBlock:"pallet incompleto"}[b];
    const f=v=>b==="fullAt"?nf(v*100)+"%":b==="leadDays"?nf(v)+" dias":b==="lateH"?nf(v)+" h":v?"bloqueia o envio":"só alerta";
    return `Regra: ${L} ${f(x.old)} → ${f(x.v)}`}
  if(a==="veh"){const n=VEH[b]?VEH[b].pt:b;
    if(c==="active")return `${n}: ${x.v?"disponível para os clientes":"retirado de uso"}`;
    if(c==="kind")return `${n}: tipo ${x.v==="container"?"contêiner":"caminhão"}`;
    if(["pt","es","en"].includes(c))return `Veículo: nome ${({pt:"em português",es:"em espanhol",en:"em inglês"})[c]} ${x.old} → ${x.v}`;
    return `${n}: ${({pos:"posições de pallet",kg:"peso máximo (kg)",m3:"cubagem (m³)"})[c]} ${nf(x.old)} → ${nf(x.v)}`}
  if(a==="prod"){const p=BY[b];if(c==="off")return `${p.pt}: ${x.v?"retirado do catálogo":"voltou ao catálogo"}`;
    return `${p.pt}: ${({lastro:"lastro (cx por camada)",alt:"camadas por pallet",loteMin:"lote mínimo (pallets)",gross:"peso bruto por caixa (kg)"})[c]} ${nf(x.old)} → ${nf(x.v)}${c==="lastro"||c==="alt"?` · ${p.cxPal} cx/pallet`:""}`}
  if(a==="block")return `${CLIENTS[b].name}: ${BY[c].pt} ${x.v?"bloqueado para o destino":"liberado para o destino"}`;
  return x.p;
}
/* Aplica o rascunho de parâmetros só durante fn (simulação de impacto) e devolve tudo como estava */
function withSettings(pd,fn){const back=Object.keys(pd).map(p=>[p,pget(p)]);try{Object.entries(pd).forEach(([p,v])=>pset(p,v));return fn()}finally{back.reverse().forEach(([p,v])=>pset(p,v))}}
function paramImpact(pd){
  const open=S.orders.filter(o=>o.status==="analise"), before=open.map(o=>calc(o.qty,o));
  return withSettings(pd,()=>{let pct=0;const ch=[];open.forEach((o,i)=>{const r0=before[i],r1=calc(o.qty,o);
    if(r0.status!==r1.status||r0.blocking!==r1.blocking)ch.push({id:o.id,from:r0.status,to:r1.status,b0:r0.blocking,b1:r1.blocking,p0:r0.maxU,p1:r1.maxU});
    else if(Math.abs(r0.maxU-r1.maxU)>1e-6)pct++});
    return {orders:ch,pct,open:open.length}});
}
function psetPending(path,v){
  const err=pvalidate(path,v);
  if(err){S.pbad[path]=err;delete S.pd[path]}
  else{delete S.pbad[path];delete S.praw[path];if(psame(pget(path),v))delete S.pd[path];else S.pd[path]=v}
}
function pChanged(el){
  const path=el.dataset.pset; let v;
  if(el.type==="checkbox")v=el.dataset.pinv?!el.checked:el.checked;

  else{const raw=String(el.value).trim();S.praw[path]=raw;v=/\d/.test(raw)?Math.round(parseNum(raw)/Number(el.dataset.pscale||1)*1e6)/1e6:NaN}
  psetPending(path,v);
  const box=el.closest("[data-pbox]")||el; box.classList.toggle("dirty",path in S.pd); box.classList.toggle("bad",!!S.pbad[path]);
  if(S.pbad[path])el.title=S.pbad[path]; else el.removeAttribute("title");
  if(el.type==="checkbox"){const l=box.querySelector(".sw-l");if(l)l.textContent=el.checked?l.dataset.on:l.dataset.off}
  if(el.type!=="checkbox"&&!S.pbad[path]&&el.tagName!=="SELECT"&&!el.hasAttribute("data-ptext")){const f=pfield(path);el.value=fmtIn(pv(path,pget(path))*((f&&f.scale)||1))}
  const m=path.match(/^prod\.([^.]+)\.(lastro|alt)$/); if(m){const p=BY[m[1]],c=document.getElementById("cxp-"+m[1]);if(c)c.textContent=fmtPT(pv("prod."+p.code+".lastro",p.lastro)*pv("prod."+p.code+".alt",p.alt),0)}
  const mv=path.match(/^veh\.([^.]+)\.(pos|kind)$/); if(mv){const c=document.getElementById("vsvg-"+mv[1]);if(c)c.innerHTML=vehMini(mv[1])}
  paintPbar();
  const nb=document.querySelector('#side [data-view="params"] .count'), n=Object.keys(S.pd).length; if(nb)nb.textContent=n; else if(n){const it=document.querySelector('#side [data-view="params"]');if(it)it.insertAdjacentHTML("beforeend",`<span class="count">${n}</span>`)}
  if(!n&&nb)nb.remove();
}
const fmtIn=x=>{const r=Math.round(x*1000)/1000;return Number.isInteger(r)?String(r):String(r).replace(".",",")};

function suggestedOrder(){
  const cl=CLIENTS[S.client], hist=S.orders.filter(o=>o.client===S.client), w={};
  hist.forEach(o=>Object.entries(o.qty).forEach(([c,q])=>{const p=BY[c];if(p)w[c]=(w[c]||0)+q/p.cxPal}));
  let items=Object.entries(w).filter(([c])=>BY[c]&&!BY[c].off&&!cl.blocked.includes(c)&&hasPrice(BY[c],cl));
  if(!items.length)items=[["12031189",10],["12034103",4],["12142501",5],["12037417",3]].filter(([c])=>BY[c]&&!BY[c].off&&!cl.blocked.includes(c)&&hasPrice(BY[c],cl));
  const veh=bigVeh(), cap=VEH[veh].pos, tot=items.reduce((a,[,v])=>a+v,0)||1, o={client:S.client,veh,mode:"pal",mixed:!!cl.mixed};
  const al=items.map(([c,v])=>{const x=v/tot*cap;return {c,n:Math.floor(x),rem:x-Math.floor(x)}});
  let left=cap-al.reduce((a,x)=>a+x.n,0); [...al].sort((a,b)=>b.rem-a.rem).forEach(x=>{if(left>0){x.n++;left--}});
  al.forEach(x=>{if(x.n>0&&x.n<BY[x.c].loteMin)x.n=0});
  const mk=()=>{const q={};al.forEach(x=>{if(x.n>0)q[x.c]=x.n*BY[x.c].cxPal});return q};
  let q=mk(), r=calc(q,o), g=0;
  while(r.maxU>1+EPS&&g++<80){const big=[...al].sort((a,b)=>b.n-a.n)[0];big.n--;q=mk();r=calc(q,o)}
  /* posições liberadas pelo lote mínimo voltam para os itens do mix, enquanto couber */
  const live=al.filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  for(let k=0;k<40&&live.length;k++){let moved=false;for(const x of live){x.n++;const q2=mk(),r2=calc(q2,o);if(r2.maxU<=1+EPS){q=q2;r=r2;moved=true}else x.n--}if(!moved)break}
  return {qty:q,veh,r};
}

  if(calc(q,base).maxU>1+EPS)Object.assign(q,S.qty);

  (sug||[]).filter(s=>s.act.startsWith("cut")).forEach(s=>{const p=BY[s.act.split(":")[1]];if(p)acts.push([t("aReduce")(p[S.lang]||p.pt),s.act])});
  ins.push(t("iBind")({pos:t("resPos"),kg:t("resKg"),m3:t("resM3")}[r.bind],fmt(r.u[r.bind]*100,0)));

function bestVehicle(d){let best=null,bu=-1;activeVeh().forEach(k=>{const rr=calc(d.qty,{...d,veh:k});if(rr.lines.length&&rr.maxU<=1+EPS&&rr.maxU>bu){bu=rr.maxU;best=k}});
  /* só troca de veículo quando o ganho de ocupação for de pelo menos 3 pontos */
  if(best&&d.veh&&best!==d.veh&&vehOn(d.veh)){const cur=calc(d.qty,{...d,veh:d.veh});if(cur.lines.length&&cur.maxU<=1+EPS&&bu-cur.maxU<0.03)return d.veh}
  return best}
function vehPicker(){
  const d=draft(), best=bestVehicle(d);
  return `<div class="vehs" role="radiogroup" aria-label="${t("vehicle")}">${Object.entries(VEH).filter(([k])=>vehOn(k)||k===S.veh).map(([k,x])=>{const rr=calc(d.qty,{...d,veh:k}),pct=rr.maxU*100,c=!rr.lines.length?"var(--surface-3)":rr.status==="excess"?"var(--err)":rr.status==="full"?"var(--ok)":"var(--warn)";
    return `<button class="veh ${S.veh===k?"on":""}" role="radio" aria-checked="${S.veh===k}" data-veh="${k}"><span class="vn">${x[S.lang]}${k===best?`<span class="rec">${t("recommended")}</span>`:""}<small>${t("capShort")(x.pos,fmt(x.kg/1000,0))} · ${fmt(x.m3,0)} m³</small></span><span class="vbar"><i style="width:${Math.min(pct,100)}%;background:${c}"></i></span><span class="vp" style="${rr.status==="excess"?"color:var(--err)":""}">${rr.lines.length?fmt(pct,0)+"%":"—"}</span></button>`}).join("")}</div>`;
}
function unitLoads(r){
  if(r.mode==="pal")return palletUnits(r).map(u=>({kg:u.reduce((a,s)=>a+s.f*s.p.cxPal*s.p.gross,0),m3:u.reduce((a,s)=>a+s.f*s.p.cxPal*s.p.m3,0),pos:1}));
  const out=[];r.lines.forEach(l=>{let left=l.cx;const per=Math.max(1,Math.floor(1/l.p.m3));while(left>0){const n=Math.min(per,left);out.push({kg:n*l.p.gross,m3:n*l.p.m3,pos:0});left-=n}});return out;
}
/* Quando o pedido não cabe: enche carretas e manda a sobra no menor veículo que comporta */
function splitPlan(r){
  if(r.status!=="excess")return null;
  const sizes=activeVeh().sort((a,b)=>VEH[a].pos-VEH[b].pos||VEH[a].kg-VEH[b].kg), BIG=bigVeh(), sum=a=>a.reduce((x,u)=>({kg:x.kg+u.kg,m3:x.m3+u.m3,pos:x.pos+u.pos}),{kg:0,m3:0,pos:0});
  const fits=(a,k)=>{const v=VEH[k],s=sum(a);return s.pos<=v.pos&&s.kg<=v.kg+1e-6&&s.m3<=v.m3+1e-6};
  const legs=[]; let rest=unitLoads(r);
  while(rest.length&&legs.length<8){
    const k=sizes.find(s=>fits(rest,s)); if(k){legs.push({veh:k,items:rest});break}
    const v=VEH[BIG],take=[],keep=[]; let kg=0,m3=0,pos=0;
    rest.forEach(u=>{if(pos+u.pos<=v.pos&&kg+u.kg<=v.kg&&m3+u.m3<=v.m3){take.push(u);kg+=u.kg;m3+=u.m3;pos+=u.pos}else keep.push(u)});
    if(!take.length)break; legs.push({veh:BIG,items:take}); rest=keep;
  }
  return legs.map(g=>{const v=VEH[g.veh],s=sum(g.items);return {veh:g.veh,pct:Math.max(r.mode==="pal"?s.pos/v.pos:0,s.kg/v.kg,s.m3/v.m3)*100,pos:s.pos}});
}
function splitHTML(r,pt){
  const legs=splitPlan(r); if(!legs||legs.length<2)return "";
  const tx=k=>(pt?T.pt:T[S.lang])[k], vn=k=>pt?VEH[k].pt:VEH[k][S.lang], f=n=>pt?fmtPT(n,0):fmt(n,0);
  return `<div class="split"><b>${tx("splitT")}</b><span>${tx("splitS")(legs.length)}</span><div class="legs">${legs.map(g=>`<span class="leg">${vn(g.veh)} · ${f(g.pct)}%${r.mode==="pal"?` · ${g.pos} pallets`:""}</span>`).join("")}</div></div>`;
}

const IMPO={text:"",items:null,file:"",err:""};
const IMP_SAMPLE="Código\tProduto\tQuantidade\tUnidade\n12031189\tCafé Tradicional 250 g\t1680\tCX\n7896005802557\tEstrada Real Premium (EAN)\t672\tCX\n12034103\tCappuccino Clássico 20 g\t324\tCX\n12142501\tSolúvel refil 40 g\t33600\tUN\n12037417\tFiltro de papel 102\t273\tCX\n12099999\tItem descontinuado\t40\tCX";
function prodIndex(){const ix={};P.forEach(p=>{ix[p.code]=p;if(p.ean)ix[String(p.ean)]=p;if(p.dun)ix[String(p.dun)]=p});return ix}
function textRows(txt){return String(txt||"").split(/\r?\n/).map(l=>/[\t;|]/.test(l)?l.split(/[\t;|]/):l.trim().split(/\s+/))}
/* Cabeçalho da planilha: coluna de código e coluna de quantidade (ex.: Order Basis usa CÓDIGOS e CAIXAS) */
const normH=c=>String(c==null?"":c).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function findHeader(rows){
  for(let i=0;i<Math.min(rows.length,40);i++){
    const n=(rows[i]||[]).map(normH);
    const codeCol=n.findIndex(c=>/^(cod|codigo|codigos|material|sku|ean|dun)\b/.test(c));
    let qCol=n.findIndex(c=>/^(caixas|cajas|cases|cx|qtd cx|qtd\. cx|quantidade de caixas?|cantidad de cajas)$/.test(c)), qUnit=qCol>=0?"CX":null;
    if(qCol<0)qCol=n.findIndex(c=>/^(quant|qtd|qtde|cant|qty)/.test(c)&&!/pallet|palet/.test(c));
    const uCol=n.findIndex(c=>/^(unidade|unid\.?|un|um|u\.m\.|unit|unidad|unidade de medida)$/.test(c));
    if(codeCol>=0&&qCol>=0)return {row:i,codeCol,qCol,uCol,qUnit};
  }
  return null;
}
const unitOfCell=c=>{const u=String(c||"").trim();return !u?null:/^u/i.test(u)?"UN":/^(k|q)/i.test(u)?"KG":/^(cx|caix|caj|cs|case)/i.test(u)?"CX":null};
function orderItem(ri,p,raw,qty,unit,cl){
  const exact=qty/UF[unit](p), cx=Math.ceil(exact-1e-9);
  const blocked=!!p.off||cl.blocked.includes(p.code)||(p.price==null&&!(p.prices&&p.prices[cl.list]!=null));
  return {row:ri+1,raw,p,qty,unit,cx,status:blocked?"blk":Math.abs(exact-cx)>1e-6?"adj":"ok"};
}
function parseOrderRows(rows){
  const h=findHeader(rows);
  if(!h)return parseOrderRowsLoose(rows);
  const ix=prodIndex(), cl=CLIENTS[S.client], out=[];
  for(let ri=h.row+1;ri<rows.length;ri++){
    const cells=(rows[ri]||[]).map(c=>String(c==null?"":c).trim()); if(!cells.some(Boolean))continue;
    const qtyRaw=cells[h.qCol]; const qty=/\d/.test(qtyRaw||"")?parseNum(qtyRaw):0;
    let p=null,ci=-1; cells.forEach((c,i)=>{if(p)return;const dg=c.replace(/[.\s-]/g,"");if(/^\d{8,14}$/.test(dg)&&ix[dg]){p=ix[dg];ci=i}});
    if(!(qty>0))continue;
    const unit=h.qUnit||unitOfCell(cells[h.uCol])||"CX";
    if(!p){const code=cells[h.codeCol];if(/^\d{6,14}$/.test(String(code).replace(/[.\s-]/g,"")))out.push({row:ri+1,raw:code,qty,unit,status:"miss"});continue}
    out.push(orderItem(ri,p,cells[ci],qty,unit,cl));
  }
  out.hb=true; return out;
}
function parseOrderRowsLoose(rows){
  const ix=prodIndex(), cl=CLIENTS[S.client], out=[];
  rows.forEach((row,ri)=>{
    const cells=row.map(c=>String(c==null?"":c).trim()); if(!cells.some(Boolean))return;
    let p=null,ci=-1;
    cells.forEach((c,i)=>{if(p)return;const dg=c.replace(/[.\s-]/g,"");if(/^\d{8,14}$/.test(dg)&&ix[dg]){p=ix[dg];ci=i}});
    const uc=cells.find(c=>/^(cx|caixas?|cajas?|cs|cases?|un|unid\w*|units?|kg|quilos?|kilos?)$/i.test(c));
    const unit=!uc?"CX":/^u/i.test(uc)?"UN":/^(k|q)/i.test(uc)?"KG":"CX";
    let qty=null; cells.forEach((c,i)=>{if(qty!=null||i===ci)return;if(/^[\d.,\s]+$/.test(c)&&/\d/.test(c)&&!/^\d{8,14}$/.test(c.replace(/[.\s-]/g,""))){const n=parseNum(c);if(n>0&&n<1e7)qty=n}});
    if(!p){const code=cells.find(c=>/^\d{8,14}$/.test(c.replace(/[.\s-]/g,"")));if(code&&qty!=null)out.push({row:ri+1,raw:code,qty,unit,status:"miss"});return}
    if(qty==null)return;
    out.push(orderItem(ri,p,cells[ci],qty,unit,cl));
  });
  return out;
}

    if(!r.lines.length)return emptyDraft();
    if(r.mode!=="pal")return A(`<p>${tr("Na carga estivada, a ocupação é pela cubagem","En la carga estibada, la ocupación es por cubicación","For floor-loaded shipments, occupancy is by cubage")}: ${fmt(r.u.m3*100,0)}%.</p><p>${draftLine(r)}</p>`);
    if(r.status==="full")return AX("comemorando",`<p>${tr("Sua carga já está completa","Tu carga ya está completa","Your load is already full")} (${fmt(r.maxU*100,0)}%).</p><p>${bindTxt(r)}</p>`,draftActs(r));

    const head=free>0?tr(`Cabem mais <b>${free} pallet${free>1?"s":""}</b> no veículo (${esc(r.v.pt)}, ${fmt(r.maxU*100,0)}% ocupado).`,`Caben <b>${free} pallet${free>1?"s":""}</b> más en el vehículo (${esc(r.v.es)}, ${fmt(r.maxU*100,0)}% ocupado).`,`<b>${free} more pallet${free>1?"s":""}</b> fit in the vehicle (${esc(r.v.en)}, ${fmt(r.maxU*100,0)}% used).`)
      :tr("Todas as posições estão ocupadas.","Todas las posiciones están ocupadas.","All positions are taken.");
    return A(`<p>${head}</p><p>${bindTxt(r)}</p><p>${tr("Posso completar com pallets cheios dos produtos que você já escolheu, dentro do peso e da cubagem.","Puedo completar con pallets llenos de los productos que ya elegiste, dentro del peso y la cubicación.","I can fill it with full pallets of the products you already picked, within weight and cubage.")}</p>`,draftActs(r));
  }
  /* 6. veículos */
  if(has("veh")){
    const b=r.lines.length?bestVehicle(d):null;
    const li=activeVeh().map(k=>{const v=VEH[k],rr=r.lines.length?calc(d.qty,{...d,veh:k}):null;return `<li><b>${esc(v[S.lang]||v.pt)}</b>: ${t("capShort")(v.pos,fmt(v.kg/1000,0))} · ${fmt(v.m3,0)} m³${rr?` · ${tr("seu pedido","tu pedido","your order")} ${fmt(rr.maxU*100,0)}%${rr.status==="excess"?tr(" (não cabe)"," (no cabe)"," (doesn't fit)"):""}`:""}${k===S.veh?tr(" · atual"," · actual"," · current"):""}</li>`}).join("");
    const rec=b?`<p>${tr("Para o seu rascunho, o melhor aproveitamento é","Para tu borrador, el mejor aprovechamiento es","For your draft, the best fit is")} <b>${esc(VEH[b][S.lang]||VEH[b].pt)}</b>.</p>`:r.lines.length?`<p>${tr("Nenhum veículo leva o rascunho inteiro. Veja a divisão em embarques no painel do pedido.","Ningún vehículo lleva el borrador entero. Mira la división en despachos en el panel del pedido.","No single vehicle takes the whole draft. See the shipment split in the order panel.")}</p>`:"";
    return A(`<p>${tr("Veículos disponíveis","Vehículos disponibles","Available vehicles")}:</p><ul>${li}</ul>${rec}`,b&&b!==S.veh?[[tr("Usar ","Usar ","Use ")+(VEH[b][S.lang]||VEH[b].pt),`data-act="veh:${b}"`]]:[]);
  }
  /* 7. pedido sugerido */
  if(has("sug")){const sg=suggestedOrder();if(!sg.r.lines.length)return A(tr("Ainda não tenho histórico para sugerir um pedido.","Todavía no tengo historial para sugerir un pedido.","I don't have enough history to suggest an order yet."));
    return A(`<p>${t("sugS")(fmt(sg.r.tot.pallets,0),VEH[sg.veh][S.lang],fmt(sg.r.maxU*100,0),money(sg.r.tot.value))}</p><ul>${sg.r.lines.map(l=>`<li>${esc(pName(l.p))}: ${fmt(l.pallets,0)} ${t("pallets")}</li>`).join("")}</ul>`,[[t("sugUse"),"data-usesug"]])}
  /* 8. importação */
  if(has("imp"))return A(`<p>${tr("Clique em <b>Importar pedido</b> e arraste o Excel ou CSV, ou cole as linhas. Eu reconheço código 3C, EAN ou DUN e a quantidade em caixas, unidades ou kg, e mostro o que encontrei antes de aplicar.","Haz clic en <b>Importar pedido</b> y arrastra el Excel o CSV, o pega las líneas. Reconozco código 3C, EAN o DUN y la cantidad en cajas, unidades o kg, y muestro lo encontrado antes de aplicar.","Click <b>Import order</b> and drop the Excel or CSV file, or paste the lines. I recognize the 3C code, EAN or DUN and quantities in cases, units or kg, and show what I found before applying.")}</p>`,[[t("impBtn"),"data-import"]]);

  /* 10. paletizada x estivada */
  if(has("est"))return A(`<p>${tr("<b>Paletizada</b>: as caixas vão em pallets PBR e cada pallet ocupa uma posição do veículo. <b>Estivada</b>: caixas soltas, sem pallets; a ocupação é pela cubagem total.","<b>Paletizada</b>: las cajas van en pallets PBR y cada pallet ocupa una posición del vehículo. <b>Estibada</b>: cajas sueltas, sin pallets; la ocupación es por cubicación total.","<b>Palletized</b>: cases go on PBR pallets and each pallet takes one vehicle position. <b>Floor loaded</b>: loose cases, no pallets; occupancy is by total cubage.")}</p><p>${tr("Seu rascunho está como","Tu borrador está como","Your draft is set to")} <b>${t(S.mode==="pal"?"paletizada":"estivada").toLowerCase()}</b>.</p>`);
  /* 11. pallet misto */
  if(has("mixed"))return A(`<p>${cl.mixed?tr("Sua conta aceita pallet misto: sobras de produtos diferentes são combinadas no mesmo pallet, o que economiza posições.","Tu cuenta acepta pallet mixto: los sobrantes de productos distintos se combinan en el mismo pallet, lo que ahorra posiciones.","Your account accepts mixed pallets: leftovers of different products are combined on the same pallet, saving positions."):tr("Sua conta trabalha sem pallet misto: cada pallet leva um só produto, e um pallet incompleto ocupa uma posição inteira.","Tu cuenta trabaja sin pallet mixto: cada pallet lleva un solo producto, y un pallet incompleto ocupa una posición entera.","Your account works without mixed pallets: each pallet carries one product, and an incomplete pallet takes a full position.")}</p><p>${tr("Essa regra é definida pela equipe de Exportação 3corações.","Esta regla la define el equipo de Exportación de 3corações.","This rule is set by the 3corações Export team.")}</p>`);
  /* 12. lote mínimo */
  if(has("lot")){
    const rule=RULES.minLotBlock?tr("Abaixo do lote mínimo, o pedido não pode ser enviado.","Debajo del lote mínimo, el pedido no se puede enviar.","Below the minimum lot, the order can't be sent."):tr("Abaixo do lote mínimo, o portal só avisa.","Debajo del lote mínimo, el portal solo avisa.","Below the minimum lot, the portal only warns.");
    if(pp.p)return A(`<p>${tr("Lote mínimo de","Lote mínimo de","Minimum lot for")} ${esc(pName(pp.p))}: <b>${fq(pp.p.loteMin)} pallet${pp.p.loteMin===1?"":"s"}</b> (${fmt(Math.ceil(pp.p.loteMin*pp.p.cxPal),0)} ${t("uCX")}).</p><p>${rule}</p>`);
    const big=allowed.filter(p=>p.loteMin>1);
    return A(`<p>${tr("Lote mínimo é a menor quantidade por produto, em pallets, definida pela 3corações.","El lote mínimo es la menor cantidad por producto, en pallets, definida por 3corações.","The minimum lot is the smallest quantity per product, in pallets, set by 3corações.")} ${rule}</p>${big.length?`<ul>${big.map(p=>`<li>${esc(pName(p))}: ${fq(p.loteMin)} pallets</li>`).join("")}</ul>`:`<p>${tr("Hoje todos os produtos do seu catálogo têm lote mínimo de 1 pallet.","Hoy todos los productos de tu catálogo tienen lote mínimo de 1 pallet.","Today every product in your catalog has a minimum lot of 1 pallet.")}</p>`}`);
  }
  /* 13. paletização */
  if(has("pallet")){
    if(pp.amb.length)return amb(p=>tr("Quantas caixas cabem num pallet de ","¿Cuántas cajas caben en un pallet de ","How many cases fit on a pallet of ")+pName(p)+"?");
    if(pp.p){const p=pp.p;return A(`<p>${esc(pName(p))}: <b>${p.cxPal} ${t("boxPal")}</b> (${p.lastro} ${t("perLayer")} × ${p.alt} ${t("layers")}).</p><p>${t("minLot")}: ${fq(p.loteMin)} pallet${p.loteMin===1?"":"s"} · ${tr("peso bruto do pallet","peso bruto del pallet","pallet gross weight")} ≈ ${fmt(p.cxPal*p.gross,0)} kg.</p>${ok(p)?"":`<p class="note err">${why(p)}</p>`}`,ok(p)?[[tr("Adicionar 1 pallet","Agregar 1 pallet","Add 1 pallet"),`data-act="add:${p.code}:1"`]]:[])}
    return A(`<p>${tr("Caixas por pallet no seu catálogo:","Cajas por pallet en tu catálogo:","Cases per pallet in your catalog:")}</p><ul>${allowed.map(p=>`<li>${esc(pName(p))}: ${p.cxPal}</li>`).join("")}</ul>`);
  }
  /* 14. preço */
  if(has("price")){
    if(pp.amb.length)return amb(p=>tr("Qual o preço de ","¿Cuál es el precio de ","What is the price of ")+pName(p)+"?");
    if(pp.p){const p=pp.p;if(!ok(p))return A(`<p>${esc(pName(p))}: ${why(p)}.</p>`);const pr=priceFor(p,S.client);return A(`<p>${esc(pName(p))}: <b>${money(pr)}</b> ${t("perBox")} (${tr("lista","lista","list")} ${cl.list}, ${cl.inc}).</p><p>${tr("Um pallet","Un pallet","One pallet")} (${p.cxPal} ${t("uCX")}) = ${money(pr*p.cxPal)}.</p>`,[[tr("Adicionar 1 pallet","Agregar 1 pallet","Add 1 pallet"),`data-act="add:${p.code}:1"`]])}
    return A(`<p>${tr(`Seus preços são em ${cl.cur} por caixa, lista ${cl.list}, ${cl.inc}:`,`Tus precios son en ${cl.cur} por caja, lista ${cl.list}, ${cl.inc}:`,`Your prices are in ${cl.cur} per case, list ${cl.list}, ${cl.inc}:`)}</p><ul>${allowed.map(p=>`<li>${esc(pName(p))}: ${money(priceFor(p,S.client))}</li>`).join("")}</ul>${r.lines.length?`<p>${tr("Valor do rascunho","Valor del borrador","Draft value")}: <b>${money(r.tot.value)}</b></p>`:""}`);
  }
  /* 15. prazo */
  if(has("date"))return A(`<p>${tr(`A data mais próxima para carregamento é <b>${dmy(minDate())}</b>, pelo prazo mínimo de ${RULES.leadDays} dias.`,`La fecha más próxima de carga es <b>${dmy(minDate())}</b>, por el plazo mínimo de ${RULES.leadDays} días.`,`The earliest loading date is <b>${dmy(minDate())}</b>, given the ${RULES.leadDays}-day minimum lead time.`)}</p><p>${tr("Você escolhe a data na revisão do pedido.","Eliges la fecha al revisar el pedido.","You pick the date when reviewing the order.")}</p>`);
  /* 16. condições comerciais */
  if(has("pay"))return A(`<p>${tr("Condições da sua conta","Condiciones de tu cuenta","Your account terms")}: <b>${cl.inc}</b> · ${cl.cur} · ${esc(cl.pay)} · ${tr("saída","salida","ships from")} ${esc(cl.filial)}.</p><p>${tr("Mudanças de condição são tratadas com a equipe de Exportação 3corações.","Los cambios de condición se tratan con el equipo de Exportación de 3corações.","Changes to terms are handled with the 3corações Export team.")}</p>`);
  /* 17. restrições */
  if(has("blk")){const bl=cl.blocked.map(c=>BY[c]).filter(Boolean),np=P.filter(p=>!p.off&&!hasPrice(p,cl));
    if(!bl.length&&!np.length)return A(tr("Todos os produtos do catálogo estão liberados para a sua conta.","Todos los productos del catálogo están habilitados para tu cuenta.","Every catalog product is available for your account."));
    return A(`${bl.length?`<p>${tr(`Não liberados para ${cl.dest}:`,`No habilitados para ${cl.dest}:`,`Not approved for ${cl.dest}:`)}</p><ul>${bl.map(p=>`<li>${esc(pName(p))}</li>`).join("")}</ul>`:""}${np.length?`<p>${t("noPrice")}: ${np.map(p=>esc(pName(p))).join(", ")}.</p>`:""}<p>${tr("A liberação depende da equipe de Exportação 3corações.","La habilitación depende del equipo de Exportación de 3corações.","Approval depends on the 3corações Export team.")}</p>`)}
  /* 18. como enviar */
  if(has("review")){const bl=r.lines.length?blockersOf(r):[];
    return AX(bl.length?"alerta":"feliz",`<p>${tr("Com o rascunho sem pendências, clique em <b>Revisar pedido</b>, escolha a data de carregamento e confirme. O pedido chega à Exportação já validado.","Con el borrador sin pendientes, haz clic en <b>Revisar pedido</b>, elige la fecha de carga y confirma. El pedido llega a Exportación ya validado.","Once the draft has no open issues, click <b>Review order</b>, pick the loading date and confirm. The order reaches the Export team already validated.")}</p>${bl.length?`<p>${tr("Pendências agora:","Pendientes ahora:","Open issues now:")}</p><ul>${bl.slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p>${draftLine(r)}</p>`}`,r.lines.length?[[t("review"),"data-chatreview"]]:[[t("sugUse"),"data-usesug"]]);}
  /* 19. falar com alguém */
  if(has("human"))return A(`<p>${tr("Para negociar preço, prazo especial ou condições, fale com a equipe de Exportação 3corações. Por aqui eu ajudo com pedidos, produtos, carga e status.","Para negociar precio, plazo especial o condiciones, habla con el equipo de Exportación de 3corações. Por aquí te ayudo con pedidos, productos, carga y estado.","To negotiate price, special lead times or terms, talk to the 3corações Export team. Here I help with orders, products, loads and status.")}</p>`);
  /* 20. produto citado sem pergunta específica */
  if(pp.amb.length)return amb(p=>pName(p));
  if(pp.p){const p=pp.p;return A(`<p><b>${esc(pName(p))}</b> <span class="code">${p.code}</span></p><ul><li>${p.cxPal} ${t("boxPal")} (${p.lastro} ${t("perLayer")} × ${p.alt} ${t("layers")})</li><li>${t("minLot")}: ${fq(p.loteMin)} pallet${p.loteMin===1?"":"s"}</li><li>${t("fPrice")}: ${ok(p)?money(priceFor(p,S.client)):why(p)}</li><li>${esc(p.unLbl)} · ${t("fGross")} ${fmt(p.gross,2)} kg · NCM ${p.ncm||"-"}</li></ul>`,ok(p)?[[tr("Adicionar 1 pallet","Agregar 1 pallet","Add 1 pallet"),`data-act="add:${p.code}:1"`]]:[])}

  if(has("thanks"))return A(tr("Por nada! Se precisar, é só perguntar.","¡De nada! Si necesitas algo, pregunta.","You're welcome! Ask me anytime."));
  return AX("pensando",`<p>${tr("Ainda não sei responder isso. Posso ajudar com:","Todavía no sé responder eso. Puedo ayudarte con:","I can't answer that yet. I can help with:")}</p>${helpList()}<p class="label">${tr("Para outros assuntos, fale com a equipe de Exportação 3corações.","Para otros temas, habla con el equipo de Exportación de 3corações.","For anything else, contact the 3corações Export team.")}</p>`);
}
function chatChips(){return S.area==="admin"?adminChips():clientChips()}
function clientChips(){
  const d=draft(),r=calc(d.qty,d),mine=S.orders.filter(o=>o.client===S.client&&o.origin!=="Order Basis"),out=[];
  if(r.status==="excess")out.push(tr("Meu pedido não cabe. O que faço?","Mi pedido no cabe. ¿Qué hago?","My order doesn't fit. What can I do?"));
  else if(r.status==="partial")out.push(tr("Como completo a carga?","¿Cómo completo la carga?","How do I fill the load?"));
  if(!r.lines.length)out.push(tr("Me sugira um pedido","Sugiéreme un pedido","Suggest an order"));
  if(r.lines.length)out.push(tr("Qual veículo é melhor para meu pedido?","¿Qué vehículo es mejor para mi pedido?","Which vehicle is best for my order?"));
  if(mine.length)out.push(tr("Status do meu último pedido","Estado de mi último pedido","Status of my last order"));
  out.push(tr("Quantas caixas cabem num pallet de Café Tradicional?","¿Cuántas cajas caben en un pallet de Café Tradicional?","How many cases fit on a pallet of Traditional Coffee?"));
  out.push(tr("Adicione 2 pallets de Cappuccino Baunilha","Agrega 2 pallets de Cappuccino Vainilla","Add 2 pallets of Vanilla Cappuccino"));
  out.push(tr("Qual a data mínima de carregamento?","¿Cuál es la fecha mínima de carga?","What is the earliest loading date?"));

  return out.slice(0,6);
}

function md(src){
  const lines=esc(String(src||"")).split(/\n/); let out="",ul=false;
  lines.forEach(l=>{const li=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);if(li){if(!ul){out+="<ul>";ul=true}out+=`<li>${li[1]}</li>`}else{if(ul){out+="</ul>";ul=false}if(l.trim())out+=`<p>${l}</p>`}});
  if(ul)out+="</ul>";
  return out.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}

function parseImpact(nq){
  const pd={}, num=nq.match(/(\d+(?:[.,]\d+)?)\s*(posic\w*|pallets?|vagas?)/);
  if(num){let k=null;Object.keys(VEH).forEach(v=>{const n=nrm(VEH[v].pt);if(nq.includes(n))k=v});
    if(!k){if(/\b40\b/.test(nq.replace(num[0],"")))k="c40";else if(/\b20\b/.test(nq.replace(num[0],"")))k="c20";else if(/conte|container/.test(nq))k="c40";else k="carreta"}
    if(VEH[k])pd[`veh.${k}.pos`]=Math.round(parseNum(num[1]))}
  const pc=nq.match(/(\d+(?:[.,]\d+)?)\s*%/); if(pc&&/complet|cheia|ocupa/.test(nq))pd["rules.fullAt"]=Math.round(parseNum(pc[1]))/100;
  if(/lote/.test(nq)&&/(alert|avis|nao bloque|so avis|só avis)/.test(nq))pd["rules.minLotBlock"]=false;
  if(/pallet incompleto|pallets incompletos/.test(nq)&&/bloque/.test(nq)&&!/nao bloque/.test(nq))pd["rules.fullPalBlock"]=true;
  const pz=nq.match(/prazo[^\d]{0,30}(\d+)\s*dias?/); if(pz)pd["rules.leadDays"]=parseInt(pz[1],10);
  return pd;
}

        [["Levar para Parâmetros",`data-pfill="${esc(JSON.stringify(pd))}"`]],"pensando")}

  /* produto */

    return A(`<p><b>${esc(p.pt)}</b> <span class="code">${p.code}</span></p><ul><li>${p.cxPal} cx/pallet (${p.lastro} × ${p.alt})</li><li>Lote mínimo ${nf(p.loteMin)} pallet${p.loteMin===1?"":"s"} · peso bruto ${fmtPT(p.gross,2)} kg/cx</li><li>Em carteira: ${fmtPT(pal)} pallets em ${inq.length} pedido${inq.length===1?"":"s"}</li>${p.off?"<li>Fora de linha</li>":""}</ul>`,[["Abrir Parâmetros",'data-view="params"']])}

    if(!d.open.length)return A(`<p>Nenhum pedido em análise agora.${d.noSap.length?` ${d.noSap.length} aprovado${d.noSap.length>1?"s":""} aguardando arquivo SAP.`:""}</p>`,[],"comemorando");
    return A(`<p>${d.open.length} pedido${d.open.length>1?"s":""} em análise${d.blk.length?`, ${d.blk.length} bloqueado${d.blk.length>1?"s":""}`:""}:</p><ul>${d.open.map(admLine).join("")}</ul>${d.noSap.length?`<p>${d.noSap.length} aprovado${d.noSap.length>1?"s":""} sem arquivo SAP.</p>`:""}`,d.open.slice(0,3).map(x=>openAct(x.o.id)),d.blk.length?"alerta":"feliz")}
  if(/^(oi|ola|bom dia|boa tarde|boa noite)\b/.test(nq))return A("<p>Oi, Lucas! Quer o resumo da fila ou ver os bloqueios?</p>",[["Resumo da fila",'data-chatq="Resumo da fila"']]);
  if(/obrigad|valeu/.test(nq))return A("<p>Por nada! Qualquer coisa, estou por aqui.</p>");
