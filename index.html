<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3C Conecta: plataforma de pedidos de exportação. Protótipo do Hackathon Cafeína Week 2026 (FIAP), desafio Pedido sem Fronteiras da 3corações.">
<title>3C Conecta</title>
<style>body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho branco leve; catálogo em lista única à esquerda, painel de embarque fixo à direita. Vermelho 3corações só como acento. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F1F2F4; --surface-3:#E3E5E8; --ink:#1F2328; --muted:#5F6670; --faint:#9AA1AB; --line:#E6E8EB;
  --gold:#FE5C16; --gold-ink:#FFFFFF; --gold-soft:#FFEDE3; --coffee:#2A2D33;
  --red:#FE5C16; --red-hover:#E24D0C; --red-soft:#FFF0E8; --on-red:#FFFFFF;
  --ok:#1F7A45; --ok-soft:#E5F3EA; --warn:#A35F00; --warn-soft:#FFF4DE; --err:#D0261B; --err-soft:#FDECEA;
  --f-cafe:#6B3A1A; --f-capp:#C08A5B; --f-sol:#E39A2D; --f-filtro:#738A55; --f-porta:#57709A;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --font:"Jost","Century Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D21; --surface-2:#23272C; --surface-3:#2F343A; --ink:#F1F3F5; --muted:#A7AEB7; --faint:#6D747D; --line:#2A2E34;
  --gold:#FF7A3D; --gold-ink:#FFFFFF; --gold-soft:#3D2014; --coffee:#0B0C0E;
  --red:#FF7A3D; --red-hover:#FF9361; --red-soft:#33231C; --on-red:#FFFFFF;
  --ok:#5BC488; --ok-soft:#16301F; --warn:#F0AE4A; --warn-soft:#33260F; --err:#FF6B61; --err-soft:#3A1715;
  --f-cafe:#B07752; --f-capp:#D8A57A; --f-sol:#F0A84A; --f-filtro:#9DB27A; --f-porta:#86A0C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D21; --surface-2:#23272C; --surface-3:#2F343A; --ink:#F1F3F5; --muted:#A7AEB7; --faint:#6D747D; --line:#2A2E34;
  --gold:#FF7A3D; --gold-ink:#FFFFFF; --gold-soft:#3D2014; --coffee:#0B0C0E;
  --red:#FF7A3D; --red-hover:#FF9361; --red-soft:#33231C; --on-red:#FFFFFF;
  --ok:#5BC488; --ok-soft:#16301F; --warn:#F0AE4A; --warn-soft:#33260F; --err:#FF6B61; --err-soft:#3A1715;
  --f-cafe:#B07752; --f-capp:#D8A57A; --f-sol:#F0A84A; --f-filtro:#9DB27A; --f-porta:#86A0C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);overflow-x:clip}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:0}
.label{font-size:12px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:6px;background:var(--red);display:grid;place-items:center;flex:none}
.mark svg{width:19px;height:19px}
.brand > div{display:flex;align-items:center;flex-wrap:nowrap;white-space:nowrap}
@media (max-width:640px){.out span,.out{font-size:0;gap:0}.out svg{width:18px;height:18px}}
.brand b{font-size:18px;font-weight:600;letter-spacing:.01em}
.proto{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,15,.12)}
.seg.sm button{padding:5px 10px;font-size:12px}
.seg.full{width:100%}.seg.full button{flex:1;padding:7px 6px}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.view{display:grid;gap:24px}

/* ---------- hero ---------- */
.hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:30px;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--muted);max-width:56ch}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--red);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.client{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);min-width:0;max-width:100%}
.avatar{width:40px;height:40px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:800;flex:none}
.client select{border:0;background:transparent;font-weight:700;font-size:14px;padding:0;max-width:100%;cursor:pointer}
.client .sub{font-size:12px;color:var(--muted)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
@media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card-pad{padding:20px}

/* ---------- catálogo ---------- */
.cat-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 20px 12px}
.cat-top h2{font-size:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:6px;padding:0 12px;height:38px;flex:1 1 220px;max-width:320px}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.search input{border:0;background:transparent;outline:0;width:100%;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 14px;border-bottom:1px solid var(--line)}
.pill{border:0;background:transparent;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;font-size:12px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.pill:hover{background:var(--surface-2);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--red);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.prod{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:6px 18px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);transition:background .15s}
.prod:last-child{border-bottom:0}
.prod.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--red)}
.prod.blocked{opacity:.55}
.tile{width:48px;height:48px;border-radius:8px;display:grid;place-items:center}
.tile svg{width:24px;height:24px}
.prod h3{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.prod .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.price{text-align:right}
.price b{font-size:15px;font-weight:700}
.price span{display:block;font-size:11.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:6px;padding:3px}
.stepper button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;font-size:17px;font-weight:600;color:var(--muted);display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:var(--surface);color:var(--ink)}
.stepper input{width:64px;height:30px;border:0;background:transparent;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;outline:0}
.stepper input::placeholder{color:var(--faint);font-weight:500}
.prod-foot{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;margin-top:4px}
.pbar{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.pbar i{width:10px;height:14px;border-radius:2px;background:var(--surface-3);position:relative;overflow:hidden;display:block}
.pbar i span{position:absolute;inset:auto 0 0 0;display:block}
.note{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.note::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.note.ok{color:var(--ok)}.note.warn{color:var(--warn)}.note.err{color:var(--err)}
.link{border:0;background:transparent;padding:0;color:var(--red);font-weight:700;font-size:12.5px}
.link:hover{text-decoration:underline}
@media (max-width:640px){
  .prod{grid-template-columns:44px minmax(0,1fr);padding:14px 16px}
  .tile{width:44px;height:44px}
  .price{text-align:left;grid-column:2}
  .stepper{grid-column:2;justify-self:start}
  .prod-foot{grid-column:1/-1}
}

/* ---------- painel embarque ---------- */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px)}
@media (max-width:1040px){.panel{position:static}}
.p-sec{padding:18px 20px;display:grid;gap:12px}
.p-sec + .p-sec{border-top:1px solid var(--line)}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p-head h2{font-size:18px}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:var(--red)}
.switch input:checked::after{left:16px}
.status{display:flex;align-items:center;gap:12px}
.ring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring svg{width:18px;height:18px}
.status b{display:block;font-size:16px;letter-spacing:-.01em}
.status small{font-size:12.5px;color:var(--muted)}
.st-full .ring{background:var(--ok-soft);color:var(--ok)}
.st-partial .ring{background:var(--warn-soft);color:var(--warn)}
.st-excess .ring{background:var(--err-soft);color:var(--err)}
.st-empty .ring{background:var(--surface-2);color:var(--faint)}
.st-excess b{color:var(--err)}
.truck{background:var(--surface-2);border-radius:8px;padding:12px}
.truck svg{width:100%;height:auto;display:block}
.meters{display:grid;gap:12px}
.meter{display:grid;gap:6px}
.meter .top-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.meter .top-row span:first-child{color:var(--muted);font-weight:500}
.meter .top-row b{font-weight:700}
.meter .bar{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.meter .bar span{display:block;height:100%;border-radius:999px;background:var(--faint)}
.meter .bar.bind span{background:var(--ink)}
.meter .bar.over span{background:var(--err)}
.bindtag{font-size:10.5px;font-weight:700;color:var(--ink);background:var(--surface-2);padding:1px 6px;border-radius:999px;margin-left:4px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;font-size:13px;padding:10px 12px;border-radius:6px;line-height:1.4}
.alert.err{background:var(--err-soft);color:var(--err)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.tip{background:var(--surface-2);color:var(--ink)}
.alert.okb{background:var(--ok-soft);color:var(--ok)}
.alert .ic{width:16px;height:16px;flex:none}
.alert button{margin-left:auto;flex:none;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.value{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat .label{display:block}
.stat b{font-size:15px;font-weight:700;display:block}
.fam{display:grid;gap:6px;font-size:12.5px}
.fam div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.fam span:nth-child(2),.fam span:nth-child(3){text-align:right;color:var(--muted)}
.btn{border:0;border-radius:6px;padding:13px 20px;font-weight:600;letter-spacing:.02em;font-size:14.5px;background:var(--red);color:var(--on-red);width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover:not(:disabled){background:var(--red-hover)}
.btn:disabled{opacity:.4}
.btn.dark{background:var(--coffee);color:#fff}
.btn.sm{width:auto;padding:10px 16px;font-size:13.5px}
.btn-soft{border:0;background:var(--surface-2);border-radius:6px;padding:9px 14px;font-weight:600;font-size:13px}
.btn-soft:hover{background:var(--surface-3)}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,10,8,.45);backdrop-filter:blur(2px);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:calc(100% - 24px);overflow:auto;display:grid;gap:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.x{width:34px;height:34px;border-radius:6px;border:0;background:var(--surface-2);font-size:16px;flex:none}
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.r,table.data th.r{text-align:right}
table.data tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.info b{display:block;font-weight:600}
.field{display:grid;gap:6px}
.field input{border:0;background:var(--surface-2);border-radius:6px;padding:10px 12px;outline:0}
.field input:focus{box-shadow:0 0 0 2px var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.err{background:var(--err-soft);color:var(--err)}.chip.neutral{background:var(--surface-2);color:var(--ink)}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.timeline div{display:grid;gap:8px;font-size:12px;color:var(--faint);font-weight:500}
.timeline div::before{content:"";height:4px;border-radius:999px;background:var(--surface-3)}
.timeline div.done{color:var(--ink);font-weight:700}
.timeline div.done::before{background:var(--red)}
.success{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success svg{width:26px;height:26px}

/* ---------- exportação ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.kpi{padding:18px 20px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi b{display:block;font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.exp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.exp{grid-template-columns:minmax(0,1fr)}}
.olist{display:grid;padding:6px}
.orow{text-align:left;border:0;background:transparent;border-radius:8px;padding:12px 14px;display:grid;gap:4px;width:100%}
.orow:hover{background:var(--surface-2)}
.orow[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--red)}
.orow .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.orow .id{font-weight:700}
.orow .r3{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h3{font-size:22px}
.callout{background:var(--red-soft);color:var(--ink);border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.5}
.callout b{color:var(--red)}
.mini-in{width:80px;border:0;background:var(--surface-2);border-radius:8px;padding:6px 8px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mini-in:disabled{background:transparent}
pre.csv{background:var(--surface-2);border-radius:8px;padding:14px;font-family:var(--mono);font-size:11.5px;overflow-x:auto;margin:0;white-space:pre;line-height:1.6}
.audit{display:grid}
.audit div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.audit div:last-child{border-bottom:0}
.audit time{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.sec-title{font-size:13px;font-weight:700;margin-bottom:6px}

/* ---------- base ---------- */
td.div{color:var(--err);font-weight:700;background:var(--err-soft)}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;counter-reset:s}
.road div{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:6px;align-content:start}
.road div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.road div.now::before{background:var(--red);color:var(--on-red)}
.road b{font-size:15px}
.road span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.rules{display:grid;gap:8px;font-size:13.5px}
.rules div{display:flex;gap:10px}
.rules div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);margin-top:8px;flex:none}
/* ---------- áreas ---------- */
:root{--admin-bg:#25282D;--admin-fg:#FFFFFF;--admin-muted:rgba(255,255,255,.62);--admin-seg:rgba(255,255,255,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--admin-bg:#0B0C0E}}
:root[data-theme="dark"]{--admin-bg:#0B0C0E}
.top.admin{background:var(--admin-bg);color:var(--admin-fg);border-bottom-color:transparent;backdrop-filter:none}
.top.admin .seg{background:var(--admin-seg)}
.top.admin .seg button{color:var(--admin-muted)}
.top.admin .seg button:hover{color:var(--admin-fg)}
.top.admin .seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.top.admin .proto{background:var(--admin-seg);color:var(--admin-muted)}
.area{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:1px;white-space:nowrap}

/* ============ MOTOR DE CÁLCULO ============ */
function calc(qty,o){
  const v=VEH[o.veh], cl=CLIENTS[o.client];
  const lines=[]; const tot={cx:0,pallets:0,net:0,gross:0,m3:0,value:0,positions:0};
  for(const p of P){
    const raw=Math.max(0,qty[p.code]||0); if(raw<EPS) continue;
    const isInt=Math.abs(raw-Math.round(raw))<1e-6; const cx=isInt?Math.round(raw):Math.ceil(raw);
    const pallets=cx/p.cxPal, full=Math.floor(pallets+EPS), frac=pallets-full;
    const hasFrac=frac>EPS;
    const missing=hasFrac?Math.ceil(p.cxPal*(full+1)-cx-EPS):0;
    const price=priceFor(p,o.client);
    const l={p,cx,pallets,full,frac:hasFrac?frac:0,missing,net:cx*p.net,gross:cx*p.gross,m3:cx*p.m3,price,value:cx*price,issues:[]};
    if(!isInt) l.issues.push({lv:"err",k:"boxMult",raw,lo:Math.floor(raw),hi:Math.ceil(raw)});
    if(cl.blocked.includes(p.code)) l.issues.push({lv:"err",k:"blocked"});
    if(p.price==null&&!(p.prices&&p.prices[cl.list]!=null)) l.issues.push({lv:"err",k:"noPrice"});
    if(pallets+EPS<p.loteMin) l.issues.push({lv:"err",k:"belowMin",v:p.loteMin});
    if(hasFrac && o.mode==="pal") l.issues.push({lv:"warn",k:"missing",v:missing,n:full+1});
    lines.push(l);
    tot.cx+=cx; tot.pallets+=pallets; tot.net+=l.net; tot.gross+=l.gross; tot.m3+=l.m3; tot.value+=l.value;
    tot.positions+=Math.ceil(pallets-EPS);
  }
  if(o.mixed) tot.positions=Math.ceil(tot.pallets-EPS);
  const u={kg:tot.gross/v.kg, m3:tot.m3/v.m3, pos:o.mode==="pal"?tot.positions/v.pos:0};
  const keys=o.mode==="pal"?["kg","m3","pos"]:["kg","m3"];
  const bind=keys.reduce((a,b)=>u[b]>u[a]?b:a,keys[0]);
  const maxU=u[bind];
  const status=!lines.length?"empty":maxU>1+EPS?"excess":maxU>=RULES.fullAt?"full":"partial";
  const over={pos:o.mode==="pal"?Math.max(0,tot.positions-v.pos):0,kg:Math.max(0,tot.gross-v.kg),m3:Math.max(0,tot.m3-v.m3)};
  const blocking=lines.some(l=>l.issues.some(i=>i.lv==="err"))||status==="excess";
  const fams={}; lines.forEach(l=>{const f=l.p.fam;fams[f]=fams[f]||{kg:0,val:0,pal:0};fams[f].kg+=l.net;fams[f].val+=l.value;fams[f].pal+=l.pallets});
  return {lines,tot,u,bind,status,over,v,blocking,fams,maxU};
}

function truckSVG(r){
  const v=r.v, cols=v.cols, cw=30, ch=26, gap=3, padX=v.cab?52:4, padY=4;
  const trailerW=cols*(cw+gap)+gap, trailerH=2*(ch+gap)+gap;
  const units=[];
  if(S.mode==="pal"){
    r.lines.forEach(l=>{for(let i=0;i<l.full;i++)units.push([{f:1,c:famColor(l.p.fam)}])});
    const fr=r.lines.filter(l=>l.frac>EPS).map(l=>({f:l.frac,c:famColor(l.p.fam)}));
    if(S.mixed){let cur=[],acc=0;fr.forEach(x=>{let rem=x.f;while(rem>EPS){const take=Math.min(rem,1-acc);cur.push({f:take,c:x.c});acc+=take;rem-=take;if(acc>=1-EPS){units.push(cur);cur=[];acc=0}}});if(cur.length)units.push(cur)}
    else fr.forEach(x=>units.push([x]));
  }
  const extra=Math.max(0,units.length-v.pos), extraCols=Math.ceil(extra/2);
  const W=padX+trailerW+(extraCols?extraCols*(cw+gap)+14:0)+4, H=trailerH+padY*2+(extra?14:0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("positions")}: ${r.tot.positions}/${v.pos}">`;
  if(v.cab)s+=`<rect x="4" y="${padY+5}" width="40" height="${trailerH-10}" rx="10" fill="var(--surface)" stroke="var(--surface-3)" stroke-width="1.5"/><rect x="9" y="${padY+11}" width="10" height="${trailerH-22}" rx="3" fill="var(--surface-3)"/>`;
  s+=`<rect x="${padX}" y="${padY}" width="${trailerW}" height="${trailerH}" rx="6" fill="var(--surface)" stroke="var(--surface-3)" stroke-width="1.5"/>`;
  if(S.mode==="est"){
    const fillW=Math.min(1,r.u.m3)*(trailerW-6); let x=padX+3; const tot=r.tot.m3||1;
    r.lines.forEach(l=>{const w=fillW*(l.m3/tot);s+=`<rect x="${x}" y="${padY+3}" width="${Math.max(0,w)}" height="${trailerH-6}" fill="${famColor(l.p.fam)}"/>`;x+=w});
    for(let gx=padX+3+10;gx<padX+3+fillW;gx+=10)s+=`<line x1="${gx}" y1="${padY+3}" x2="${gx}" y2="${padY+trailerH-3}" stroke="var(--surface)" stroke-opacity=".5"/>`;
  } else {
    for(let i=0;i<Math.max(v.pos,units.length);i++){
      const inside=i<v.pos, col=inside?Math.floor(i/2):Math.floor((i-v.pos)/2), row=i%2;
      const x=inside?padX+gap+col*(cw+gap):padX+trailerW+14+col*(cw+gap), y=padY+gap+row*(ch+gap);
      s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="3" fill="${inside?"var(--surface-2)":"none"}" ${inside?"":'stroke="var(--err)" stroke-dasharray="3 2" stroke-width="1.5"'}/>`;
      const u=units[i]; if(u){let yy=y+ch;u.forEach(seg=>{const h=ch*seg.f;yy-=h;s+=`<rect x="${x}" y="${yy}" width="${cw}" height="${h}" rx="${seg.f>.95?3:1}" fill="${seg.c}" ${inside?"":'opacity=".45"'}/>`})}
    }
    if(extra)s+=`<text x="${padX+trailerW+14}" y="${H-1}" font-size="10" font-weight="700" font-family="var(--font)" fill="var(--err)">+${extra}</text>`;
  }
  return s+`</svg>`;
}

function meter(label,val,cap,unit,u,isBind,d=0){
  const pct=Math.min(u,1)*100, over=u>1+EPS;
  return `<div class="meter"><div class="top-row"><span>${label}${isBind?`<span class="bindtag">${t("bind")}</span>`:""}</span><span class="num"><b style="${over?"color:var(--err)":""}">${fmt(val,d)}</b> / ${fmt(cap,d)} ${unit}</span></div>
  <div class="bar ${over?"over":isBind?"bind":""}"><span style="width:${pct}%"></span></div></div>`;
}

function suggestions(r){
  const out=[]; if(!r.lines.length||S.mode!=="pal") return out;
  const v=r.v;
  if(r.status==="excess"&&r.over.pos>0){
    const big=[...r.lines].sort((a,b)=>b.pallets-a.pallets)[0];
    out.push({txt:t("sugCut")(r.over.pos,big.p[S.lang]),act:`cut:${big.p.code}:${r.over.pos}`});
  } else if(r.status!=="excess"){
    const free=v.pos-r.tot.positions;
    if(r.lines.some(l=>l.frac>EPS)) out.push({txt:t("sugRound"),act:"round"});
    else if(free>=1){
      const ok=r.lines.filter(l=>!CLIENTS[S.client].blocked.includes(l.p.code)).sort((a,b)=>b.cx-a.cx);
      for(const l of ok){const add=free*l.p.cxPal;if(r.tot.gross+add*l.p.gross<=v.kg&&r.tot.m3+add*l.p.m3<=v.m3){out.push({txt:t("sugAdd")(free,l.p[S.lang]),act:`add:${l.p.code}:${free}`});break}}
    }
  }
  return out;
}

const ok=v=>typeof v==="number"&&isFinite(v)&&v>0;

function mapFam(s){const u=String(s||"").toUpperCase().trim();if(!u)return null;if(u.startsWith("CAF"))return "CAFES";if(u.startsWith("CAPP"))return "CAPPUCCINO";if(u.startsWith("SOL"))return "SOLUVEIS";if(u.startsWith("PORTA"))return "PORTA";if(u.startsWith("FILTRO"))return "FILTROS";return u}

async function readFiles(list){
  IMP.error="";

  const out=[];
  for(const f of list){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true});
      let hi=-1;for(let i=0;i<Math.min(rows.length,10);i++){if(rows[i].some(c=>String(c).trim()==="Material")){hi=i;break}}
      const head=hi>=0?rows[hi].map(h=>String(h).trim()):[]; const body=hi>=0?rows.slice(hi+1).filter(r=>r.some(c=>c!==""&&c!=null)):[];
      const kind=head.includes("UM alternativa")?"conferencia":head.includes("Lista de Preço")?"registros":head.includes("Lastro")?"materiais":"desconhecido";
      out.push({name:f.name,kind,head,body});
    }catch(e){out.push({name:f.name,kind:"erro",head:[],body:[]})}
  }
  IMP.files=out; IMP.preview=buildPreview(out); render();
}
function buildPreview(files){
  const conf=files.find(f=>f.kind==="conferencia"),mat=files.find(f=>f.kind==="materiais"),reg=files.find(f=>f.kind==="registros");
  if(!conf&&!mat&&!reg) return {items:[],msg:"Nenhuma extração reconhecida. Use os arquivos Conferência de produtos, Materiais ou Registros, como saem do SAP."};
  const R={}; const get=c=>R[c]=R[c]||{code:c,alerts:[]};
  if(mat){const h=mat.head,iM=h.indexOf("Material"),iD=h.indexOf("Descrição"),iL=h.indexOf("Lastro"),iA=h.indexOf("Altura");
    mat.body.forEach(r=>{const c=String(r[iM]).trim();if(!c)return;const x=get(c);x.sap=x.sap||String(r[iD]).trim();x.lastro=num(r[iL]);x.alt=num(r[iA])})}
  if(conf){const h=conf.head,iM=h.indexOf("Material"),iD=h.indexOf("Texto breve material"),iU=h.indexOf("UM alternativa"),iC=h.indexOf("Contador"),iJ=h.indexOf("Comprimento"),iK=h.indexOf("Largura"),iH=h.indexOf("Altura"),iV=h.indexOf("Volume"),iN=h.indexOf("Peso líquido"),iG=h.indexOf("Peso bruto"),iW=h.indexOf("Unidade de peso"),iS=h.indexOf("Prazo de validade"),iF=h.indexOf("Denominação"),iB=iF>=0?h.indexOf("Denominação",iF+1):-1,iL=h.indexOf("Lastro"),iA=h.lastIndexOf("Altura");
    conf.body.forEach(r=>{const c=String(r[iM]).trim();if(!c)return;const x=get(c);x.sap=String(r[iD]).trim()||x.sap;x.famRaw=String(r[iF]||"").trim();x.brandRaw=iB>=0?String(r[iB]).trim():"";x.shelf=num(r[iS]);
      if(!ok(x.lastro)&&iL>=0){x.lastro=num(r[iL]);x.alt=num(r[iA])}
      if(String(r[iU]).trim()==="CX"){const k=String(r[iW]).trim().toUpperCase()==="G"?0.001:1;x.un=num(r[iC]);x.net=num(r[iN])*k;x.gross=num(r[iG])*k;x.dm3=num(r[iV]);x.dims=[r[iJ],r[iK],r[iH]].map(v=>Math.round(num(v))).join("×")}})}
  if(reg){const h=reg.head,iM=h.indexOf("Material"),iD=h.indexOf("Desc. Material"),iL=h.indexOf("Lista de Preço"),iP=h.indexOf("Preço Sugerido"),iDe=h.indexOf("Válido desde"),iAt=h.indexOf("Válido até"),iX=h.indexOf("Exclusão"),iMa=h.indexOf("Marca"),iFa=h.indexOf("Família");const now=new Date();
    reg.body.forEach(r=>{const c=String(r[iM]).trim();if(!c)return;if(Number(r[iX])===1)return;const de=r[iDe] instanceof Date?r[iDe]:null,at=r[iAt] instanceof Date?r[iAt]:null;if((de&&de>now)||(at&&at<now))return;
      const x=get(c);x.sap=x.sap||String(r[iD]).trim();x.prices=x.prices||{};x.pdate=x.pdate||{};const l=String(r[iL]).trim(),pr=num(r[iP]);if(!ok(pr))return;
      if(!x.pdate[l]||(de&&de>x.pdate[l])){x.prices[l]=pr;x.pdate[l]=de||new Date(0)}
      if(iMa>=0&&!x.brandRaw)x.brandRaw=String(r[iMa]);if(iFa>=0&&!x.famRaw)x.famRaw=String(r[iFa]).replace(/\s*\(\d+\)/,"")})}
  const items=[]; let skipped=0;
  Object.values(R).forEach(x=>{
    const cur=BY[x.code]; const alerts=[];
    if(!cur&&(!ok(x.un)||!ok(x.lastro))){skipped++;return}
    let gross=ok(x.gross)?x.gross:cur&&cur.gross;
    if(ok(x.gross)&&ok(x.net)&&x.gross<x.net){alerts.push("Peso bruto menor que o líquido no SAP (unidade trocada)."+(cur?" Mantido o valor atual.":""));gross=cur?cur.gross:x.net}
    let price,priceSrc,prices=cur&&cur.prices;
    if(x.prices&&Object.keys(x.prices).length){prices=x.prices;price=x.prices.US!=null?x.prices.US:Object.values(x.prices)[0];priceSrc="sap"}
    else if(cur&&cur.price!=null){price=cur.price;priceSrc=reg?"manual":cur.priceSrc;if(reg)alerts.push("Sem preço vigente no SAP. Mantido o preço manual.")}
    else{price=null;priceSrc="missing";alerts.push("Sem preço. Fica indisponível no catálogo até ter preço.")}
    if(!cur)alerts.push("Lote mínimo não vem do SAP. Usado 1 pallet como padrão.");
    const p={code:x.code,fam:mapFam(x.famRaw)||(cur&&cur.fam)||"OUTROS",brand:mapBrand(x.brandRaw)||(cur&&cur.brand)||"3corações",sap:x.sap||(cur&&cur.sap),
      pt:cur?cur.pt:x.sap,es:cur?cur.es:x.sap,un:ok(x.un)?x.un:cur.un,unLbl:cur?cur.unLbl:unLabel(x.sap,x.un),net:ok(x.net)?x.net:cur.net,gross,dm3:ok(x.dm3)?x.dm3:cur.dm3,
      lastro:ok(x.lastro)?x.lastro:cur.lastro,alt:ok(x.alt)?x.alt:cur.alt,price,priceSrc,prices,loteMin:cur?cur.loteMin:1,shelf:ok(x.shelf)?x.shelf:cur&&cur.shelf,ncm:cur?cur.ncm:"",dims:x.dims||(cur&&cur.dims),ob:cur?cur.ob:null};
    p.cxPal=p.lastro*p.alt;p.m3=p.dm3/1000;
    const ch=[];
    if(cur){const cmp=(k,a,b,d)=>{if(a!=null&&b!=null&&Math.abs(a-b)>(d||0.001))ch.push(`${k}: ${fmtPT(a,a%1?2:0)} → ${fmtPT(b,b%1?2:0)}`)};
      cmp("cx/pallet",cur.cxPal,p.cxPal);cmp("peso bruto/cx",cur.gross,p.gross,0.005);cmp("peso líquido/cx",cur.net,p.net,0.005);cmp("volume/cx (dm³)",cur.dm3,p.dm3,0.01);if(cur.price!=null&&p.price!=null)cmp("preço US$",cur.price,p.price,0.005)}

}

  if(e.target.id==="clientSel"){S.client=e.target.value;S.lang=CLIENTS[S.client].demo?"es":S.lang;render();return}

  if(e.target.dataset.q){const c=e.target.dataset.q;const p=BY[c];setQty(c,parseNum(e.target.value)/UF[unitOf(c)](p));render();return}
  if(e.target.dataset.edit){const o=S.orders.find(x=>x.id===S.sel);const code=e.target.dataset.edit;const nv=Math.max(0,parseInt(e.target.value.replace(/\D/g,""),10)||0);const old=o.qty[code]||0;
    if(nv!==old){o.qty[code]=nv;if(!nv)delete o.qty[code];o.audit.push({at:nowStamp(),who:"Lucas (Exportação)",what:`Alterou ${code} (${BY[code].pt}) de ${fmtPT(old,0)} para ${fmtPT(nv,0)} cx`});render();toast("Alteração registrada na auditoria");return}render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&(e.target.dataset.q||e.target.dataset.edit))e.target.blur();if(e.key==="Escape")document.getElementById("overlay").hidden=true});
render();
</script>
</body>
