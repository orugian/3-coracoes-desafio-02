/* ============ CAMADA DE DADOS (espelha a API REST) ============ */
/* Cada método corresponde a um endpoint descrito no README. O servidor recalcula tudo com o mesmo motor:
   o navegador nunca é a fonte da verdade para preço, pallets ou ocupação. */
const FLOW={analise:["aprovado"],aprovado:["sap"],sap:["sap"]};
/* Pedido aprovado guarda a capacidade do veículo usada na aprovação: mudar um parâmetro depois não reescreve o passado */
const vsnapOf=k=>{const v=VEH[k];return v?{pos:v.pos,kg:v.kg,m3:v.m3}:undefined};
class ApiError extends Error{constructor(status,msg,details){super(msg);this.status=status;this.details=details||[]}}
const RLOG=[];
const actorClient=()=>`${CLIENTS[S.client].contact} (${CLIENTS[S.client].name})`, ACTOR_EXP="Lucas (Exportação)";
const stamp=()=>({at:nowStamp(),ts:new Date().toISOString()});
function nextId(){const n=S.orders.reduce((a,o)=>Math.max(a,parseInt(String(o.id).split("-").pop(),10)||0),0)+1;return "3CC-2026-"+String(n).padStart(4,"0")}
function draft(){return {client:S.client,veh:S.veh,mode:S.mode,mixed:!!CLIENTS[S.client].mixed,qty:S.qty}}
function isoLocal(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function minDate(){const d=new Date();d.setDate(d.getDate()+RULES.leadDays);return isoLocal(d)}
function orderIssues(r){const out=[];if(r.status==="excess")out.push({code:"CAPACITY",over:r.over});r.lines.forEach(l=>l.issues.filter(i=>i.lv==="err").forEach(i=>out.push({code:i.k.toUpperCase(),material:l.p.code})));return out}
const API={
  /* GET /api/v1/orders/:id */
  get(id){const o=S.orders.find(x=>x.id===id);if(!o)throw new ApiError(404,"Pedido não encontrado");return o},
  /* POST /api/v1/orders/quote: mesmo motor do servidor, sem gravar */
  quote(d){return calc(d.qty,d)},
  /* POST /api/v1/orders  (cabeçalho Idempotency-Key = draftId) */
  createOrder(d,meta){
    const dup=S.orders.find(o=>o.draftId&&o.draftId===meta.draftId); if(dup)return dup;
    const r=calc(d.qty,d), issues=orderIssues(r);
    if(!r.lines.length)throw new ApiError(422,"Pedido sem itens");
    if(issues.length)throw new ApiError(422,"Pedido com bloqueios",issues);
    if(meta.date&&meta.date<minDate())throw new ApiError(422,"Data de carregamento antes do prazo mínimo");
    const qty={};r.lines.forEach(l=>qty[l.p.code]=l.cx);
    const o={id:nextId(),draftId:meta.draftId,v:1,client:d.client,veh:d.veh,mode:d.mode,mixed:!!d.mixed,qty,ref:String(meta.ref||"").replace(/[;\r\n"\t]/g," ").trim().slice(0,30),date:meta.date||"",status:"analise",created:nowStamp(),createdMs:Date.now(),origin:"Portal",audit:[]};
    o.audit.push({...stamp(),who:actorClient(),what:`Pedido criado no portal com ${r.lines.length} itens e validado automaticamente (${T.pt["st_"+r.status].toLowerCase()}, ${fmtPT(r.maxU*100,0)}%)`});
    if(CLIENTS[d.client].autoApprove&&!r.blocking&&r.maxU>=RULES.fullAt){o.status="aprovado";o.vsnap=vsnapOf(o.veh);o.auto=true;o.approved=nowStamp();o.approvedMs=Date.now();o.v=2;o.audit.push({...stamp(),who:"Regra de aprovação automática",what:`Aprovado automaticamente: sem bloqueios e carga completa (${fmtPT(r.maxU*100,0)}%)`})}
    S.orders.unshift(o); save(); return o;
  },
  /* PATCH /api/v1/orders/:id/items/:material */
  updateItem(id,code,nv){
    const o=API.get(id); if(o.status!=="analise")throw new ApiError(409,"Só pedidos em análise podem ser alterados");
    nv=Math.max(0,Math.floor(nv||0)); const old=o.qty[code]||0; if(nv===old)return o;
    if(nv)o.qty[code]=nv; else delete o.qty[code];
    o.v=(o.v||1)+1; o.audit.push({...stamp(),who:ACTOR_EXP,kind:"edit",code,old,nv,what:`Alterou ${code} (${BY[code]?BY[code].pt:code}) de ${fmtPT(old,0)} para ${fmtPT(nv,0)} cx`});
    save(); return o;
  },
  /* POST /api/v1/orders/:id/approve */
  approve(id){
    const o=API.get(id); if(!FLOW[o.status].includes("aprovado"))throw new ApiError(409,"Este pedido não está em análise");
    const rr=calc(o.qty,o); if(!rr.lines.length)throw new ApiError(409,"O pedido está sem itens"); if(rr.blocking)throw new ApiError(409,"O pedido ainda tem bloqueios");
    const adj=adjCount(o); o.status="aprovado"; o.vsnap=vsnapOf(o.veh); o.approved=nowStamp(); o.approvedMs=Date.now(); o.v=(o.v||1)+1;
    o.audit.push({...stamp(),who:ACTOR_EXP,what:adj?`Pedido aprovado após ${adj} ajuste${adj>1?"s":""}`:"Pedido aprovado sem alterações"}); save(); return o;
  },
  /* POST /api/v1/orders/:id/sap-export */
  exportSap(id){
    const o=API.get(id); if(!FLOW[o.status].includes("sap"))throw new ApiError(409,"Aprove o pedido antes de gerar o arquivo Sirius/SAP");
    if(o.status!=="sap"){o.status="sap";o.sapAt=nowStamp();o.v=(o.v||1)+1;o.audit.push({...stamp(),who:ACTOR_EXP,what:"Arquivo para upload no Sirius/SAP gerado"})}
    save(); return o;
  },
  /* PUT /api/v1/clients/:id/rules */
  setClientRule(k,field,val){
    if(!CLIENTS[k])throw new ApiError(404,"Cliente não encontrado"); if(!["mixed","autoApprove"].includes(field))throw new ApiError(400,"Regra desconhecida");
    CLIENTS[k][field]=!!val; RLOG.unshift({...stamp(),who:ACTOR_EXP,what:field==="mixed"?`${CLIENTS[k].name}: pallet misto ${val?"liberado":"não aceito"}`:`${CLIENTS[k].name}: aprovação automática ${val?"ativada":"desligada"}`}); save(); return CLIENTS[k];
  },
  /* GET /api/v1/settings */
  getSettings(){return {rules:{...RULES},vehicles:JSON.parse(JSON.stringify(VEH)),products:P.map(p=>({code:p.code,lastro:p.lastro,alt:p.alt,cxPal:p.cxPal,loteMin:p.loteMin,gross:p.gross,active:!p.off})),restrictions:Object.fromEntries(Object.entries(CLIENTS).map(([k,c])=>[k,[...c.blocked]]))}},
  /* PATCH /api/v1/settings: lote {caminho: valor}. Valida tudo antes de aplicar qualquer coisa (tudo ou nada) */
  saveSettings(ch){
    ch=ch||{};
    const errs=Object.entries(ch).map(([p,v])=>({field:p,msg:pvalidate(p,v)})).filter(x=>x.msg);
    if(errs.length)throw new ApiError(422,errs[0].msg,errs);
    const left=Object.keys(VEH).filter(k=>("veh."+k+".active") in ch?ch["veh."+k+".active"]:vehOn(k));
    if(!left.length)throw new ApiError(422,"Mantenha pelo menos um veículo disponível para os clientes");
    const done=[];
    Object.entries(ch).forEach(([p,v])=>{const old=pget(p);if(psame(old,v))return;pset(p,v);done.push({p,old,v})});
    done.forEach(x=>RLOG.unshift({...stamp(),who:ACTOR_EXP,kind:"param",what:pdesc(x)}));
    save(); return done;
  },
  /* POST /api/v1/settings/vehicles */
  addVehicle(d){
    const x={pt:String(d.pt||"").trim(),es:String(d.es||"").trim(),en:String(d.en||"").trim(),kind:d.kind==="container"?"container":"trailer",pos:d.pos,kg:d.kg,m3:d.m3};
    if(!x.es)x.es=x.pt; if(!x.en)x.en=x.pt;
    const errs=["pt","es","en","pos","kg","m3"].map(f=>({field:f,msg:pvalidate("veh.__new."+f,x[f])})).filter(e=>e.msg);
    if(x.pt&&Object.values(VEH).some(v=>nrm(v.pt)===nrm(x.pt)))errs.push({field:"pt",msg:"Já existe um veículo com esse nome"});
    if(errs.length)throw new ApiError(422,errs[0].msg,errs);
    let key="v-"+(nrm(x.pt).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24)||"veiculo"), i=2; while(VEH[key])key=key.replace(/-\d+$/,"")+"-"+(i++);
    VEH[key]={...x,cols:Math.ceil(x.pos/2),cab:x.kind==="trailer",active:true,custom:true};
    RLOG.unshift({...stamp(),who:ACTOR_EXP,kind:"param",what:`Novo veículo: ${x.pt} (${x.pos} posições, ${nf(x.kg)} kg, ${nf(x.m3)} m³)`}); save(); return key;
  },
  /* DELETE /api/v1/settings/vehicles/:id */
  removeVehicle(k){
    const x=VEH[k]; if(!x)throw new ApiError(404,"Veículo não encontrado");
    if(!x.custom)throw new ApiError(409,"Veículos padrão não podem ser excluídos. Retire de uso.");
    if(S.orders.some(o=>o.veh===k))throw new ApiError(409,"Veículo usado em pedidos. Retire de uso em vez de excluir.");
    delete VEH[k]; Object.keys(S.pd).forEach(p=>{if(p.startsWith("veh."+k+"."))delete S.pd[p]});
    RLOG.unshift({...stamp(),who:ACTOR_EXP,kind:"param",what:`Veículo excluído: ${x.pt}`}); save(); return true;
  },
  /* POST /api/v1/settings/reset {scope: rules | veh | prod | dest | all} */
  resetSettings(scope){
    const ch={}, all=scope==="all";
    if(all||scope==="rules")Object.keys(RULES_DEF).forEach(k=>{ch["rules."+k]=RULES_DEF[k]});
    if(all||scope==="veh")Object.keys(VEH_DEF).forEach(k=>{if(!VEH[k])return;["pos","kg","m3","pt","es","en"].forEach(f=>{ch[`veh.${k}.${f}`]=VEH_DEF[k][f]});ch[`veh.${k}.active`]=true});
    if(all||scope==="prod")P.forEach(p=>{const d=P_DEF[p.code];if(d)Object.entries(d).forEach(([f,v])=>{ch[`prod.${p.code}.${f}`]=v});ch[`prod.${p.code}.off`]=false});
    if(all||scope==="dest")Object.keys(CLIENTS).forEach(k=>P.forEach(p=>{ch[`block.${k}.${p.code}`]=(BLOCK_DEF[k]||[]).includes(p.code)}));
    const done=API.saveSettings(ch);
    if(all||scope==="veh")Object.keys(VEH).filter(k=>VEH[k].custom&&!S.orders.some(o=>o.veh===k)).forEach(k=>{API.removeVehicle(k);done.push({p:"veh."+k})});
    return done;
  }
};

/* ============ PERSISTÊNCIA LOCAL (sem servidor) ============ */
/* Guarda pedidos, carrinho e regras no navegador para o estado sobreviver a um recarregamento.
   Em produção, isso é o banco de dados. Se os dados-base do catálogo mudarem, o estado salvo é descartado. */
const STORE_KEY="3cc-v4";
const BASE_SIG=P.map(p=>p.code+":"+p.cxPal+":"+p.price+":"+p.gross).join("|");
let saveTimer=0;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify({v:2,base:BASE_SIG,orders:S.orders,qty:S.qty,unit:S.unit,veh:S.veh,mode:S.mode,lang:S.lang,client:S.client,view3d:S.view3d,rules:Object.fromEntries(Object.entries(CLIENTS).map(([k,c])=>[k,{mixed:!!c.mixed,autoApprove:!!c.autoApprove}])),fam:FAM,catalog:P,implog:IMP.log,rlog:RLOG.slice(0,80),drafts:S.drafts,draftId:S.draftId,vehicles:VEH,brules:RULES,blocked:Object.fromEntries(Object.entries(CLIENTS).map(([k,c])=>[k,c.blocked]))}))}catch(_){}},200)}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||d.v!==2||d.base!==BASE_SIG)return false;
    if(Array.isArray(d.orders)&&d.orders.every(o=>o&&o.id&&o.qty&&FLOW[o.status]))S.orders=d.orders;
    if(d.qty&&typeof d.qty==="object")S.qty=d.qty; if(d.unit&&typeof d.unit==="object")S.unit=d.unit;
    if(VEH[d.veh])S.veh=d.veh; if(d.mode==="pal"||d.mode==="est")S.mode=d.mode; if(T[d.lang])S.lang=d.lang; if(CLIENTS[d.client])S.client=d.client; if(d.view3d==="2d"||d.view3d==="3d")S.view3d=d.view3d;
    if(d.rules)Object.entries(d.rules).forEach(([k,x])=>{if(CLIENTS[k]){CLIENTS[k].mixed=!!(x&&x.mixed);CLIENTS[k].autoApprove=!!(x&&x.autoApprove)}});
    if(d.vehicles&&typeof d.vehicles==="object"){const ok=x=>x&&typeof x.pt==="string"&&[x.pos,x.kg,x.m3].every(n=>typeof n==="number"&&n>0);const nv=Object.entries(d.vehicles).filter(([k,x])=>ok(x));if(nv.length){Object.keys(VEH).forEach(k=>{if(!d.vehicles[k]&&!VEH_DEF[k])delete VEH[k]});nv.forEach(([k,x])=>{VEH[k]=Object.assign(VEH[k]||{},x)})}if(VEH[d.veh])S.veh=d.veh}
    if(Array.isArray(d.drafts)&&d.drafts.every(x=>x&&x.id&&x.client&&x.qty&&typeof x.qty==="object")){S.drafts=d.drafts;if(d.drafts.some(x=>x.id===d.draftId))S.draftId=d.draftId}
    if(d.brules&&typeof d.brules==="object")Object.keys(RULES_DEF).forEach(k=>{if(typeof d.brules[k]===typeof RULES_DEF[k])RULES[k]=d.brules[k]});

function act(a){
  const [k,code,n]=a.split(":");
  if(k==="fill"){const n=fillLoad();render();toast(t("tFilled")(n));return}
  if(k==="veh"&&VEH[code])S.veh=code;

  if(k==="add")setQty(code,(S.qty[code]||0)+Number(n)*BY[code].cxPal);
  if(k==="cut"){const p=BY[code];setQty(code,Math.max(0,Math.ceil(S.qty[code]/p.cxPal-EPS)-Number(n))*p.cxPal)}
  render();toast(t("tApplied"));
}

  if(e.target.dataset.edit){const code=e.target.dataset.edit;const nv=parseInt(String(e.target.value).replace(/\D/g,""),10)||0;let changed=false;try{const o=API.get(S.sel);changed=(o.qty[code]||0)!==nv;API.updateItem(S.sel,code,nv)}catch(err){toast(err.message,"err");changed=false}render();if(changed)toast("Alteração registrada na auditoria");return}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&(e.target.dataset.q||e.target.dataset.edit||e.target.dataset.pset||e.target.dataset.dname))e.target.blur();if(e.key==="Escape"){const ov=document.getElementById("overlay");if(!ov.hidden)ov.hidden=true;else if(CHAT.open)chatOpen(false)}});
document.addEventListener("submit",e=>{if(e.target.id!=="chatForm")return;e.preventDefault();const i=document.getElementById("chatIn"),q=i.value.trim();if(!q||CHAT.busy)return;i.value="";chatAsk(q,false)});
render();
aiInit();
/* Fotos da pasta assets/produtos: um arquivo com o código SAP no nome substitui a foto embutida */
function loadFolderPhotos(){P.forEach(p=>{const exts=["jpg","png","webp"];const tryExt=i=>{if(i>=exts.length)return;const url=`assets/produtos/${p.code}.${exts[i]}`;const im=new Image();im.onload=()=>{IMG[p.code]=url;delete IMGNOTE[p.code];render()};im.onerror=()=>tryExt(i+1);im.src=url};tryExt(0)})}
loadFolderPhotos();
</script>
