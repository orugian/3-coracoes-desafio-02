<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3C Conecta: plataforma de pedidos de exportação da 3corações, com plano de carga em 3D, importação de pedidos por Excel e arquivo pronto para o SAP.">
<title>3C Conecta</title>
<style>body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho branco leve; catálogo em lista única à esquerda, painel de embarque fixo à direita. Vermelho 3corações só como acento. */
:root{
  --bg:#ECE7E1; --surface:#FFFFFF; --surface-2:#F5F1EC; --surface-3:#E4DDD5; --ink:#211C18; --muted:#615851; --faint:#857A71; --line:#E3DCD4;
  --gold:#FE5C16; --gold-ink:#FFFFFF; --gold-soft:#FFEDE3; --coffee:#2A2D33;
  --accent-text:#C2410C; --sel:#FFF6F0; --sel-line:#FFD9C2;
  --red:#FE5C16; --red-hover:#E24D0C; --red-soft:#FFF0E8; --on-red:#FFFFFF;
  --ok:#1F7A45; --ok-soft:#E5F3EA; --warn:#A35F00; --warn-soft:#FFF4DE; --err:#D0261B; --err-soft:#FDECEA;
  --f-cafe:#6B3A1A; --f-capp:#C08A5B; --f-sol:#E39A2D; --f-filtro:#738A55; --f-porta:#57709A;
  --shadow:0 1px 2px rgba(45,30,20,.06),0 6px 18px rgba(45,30,20,.07);
  --font:"Jost","Century Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D21; --surface-2:#23272C; --surface-3:#2F343A; --ink:#F1F3F5; --muted:#A7AEB7; --faint:#6D747D; --line:#2A2E34;
  --gold:#FF7A3D; --gold-ink:#FFFFFF; --gold-soft:#3D2014; --coffee:#0B0C0E;
  --accent-text:#FF8A57; --sel:#2A2320; --sel-line:#4A3328;
  --red:#FF7A3D; --red-hover:#FF9361; --red-soft:#33231C; --on-red:#FFFFFF;
  --ok:#5BC488; --ok-soft:#16301F; --warn:#F0AE4A; --warn-soft:#33260F; --err:#FF6B61; --err-soft:#3A1715;
  --f-cafe:#B07752; --f-capp:#D8A57A; --f-sol:#F0A84A; --f-filtro:#9DB27A; --f-porta:#86A0C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D21; --surface-2:#23272C; --surface-3:#2F343A; --ink:#F1F3F5; --muted:#A7AEB7; --faint:#6D747D; --line:#2A2E34;
  --gold:#FF7A3D; --gold-ink:#FFFFFF; --gold-soft:#3D2014; --coffee:#0B0C0E;
  --accent-text:#FF8A57; --sel:#2A2320; --sel-line:#4A3328;
  --red:#FF7A3D; --red-hover:#FF9361; --red-soft:#33231C; --on-red:#FFFFFF;
  --ok:#5BC488; --ok-soft:#16301F; --warn:#F0AE4A; --warn-soft:#33260F; --err:#FF6B61; --err-soft:#3A1715;
  --f-cafe:#B07752; --f-capp:#D8A57A; --f-sol:#F0A84A; --f-filtro:#9DB27A; --f-porta:#86A0C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);overflow-x:clip}
body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:13px;color:var(--faint);letter-spacing:0}
.label{font-size:13px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:6px;background:var(--red);display:grid;place-items:center;flex:none}
.mark svg{width:19px;height:19px}
.brand > div{display:flex;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.brand > .mark{display:grid;place-items:center}
@media (max-width:640px){.out span,.out{font-size:0;gap:0}.out svg{width:18px;height:18px}}
.brand b{font-size:18px;font-weight:600;letter-spacing:.01em}
.proto{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,15,.12)}
.seg.sm button{padding:5px 10px;font-size:13px}
.seg.full{width:100%}.seg.full button{flex:1;padding:7px 6px}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.view{display:grid;gap:24px}

/* ---------- hero ---------- */
.hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:30px;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--muted);max-width:56ch}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent-text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.client{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);min-width:0;max-width:100%}
.avatar{width:40px;height:40px;border-radius:8px;background:var(--red-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:600;flex:none}
.client select{border:0;background:transparent;font-weight:600;font-size:14px;padding:0;max-width:100%;cursor:pointer}
.client .sub{font-size:13px;color:var(--muted)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
@media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card-pad{padding:20px}

/* ---------- catálogo ---------- */
.cat-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 20px 12px}
.cat-top h2{font-size:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:6px;padding:0 12px;height:38px;flex:1 1 220px;max-width:320px}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.search input{border:0;background:transparent;outline:0;width:100%;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 14px;border-bottom:1px solid var(--line)}
.pill{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.pill .n{font-size:13px;opacity:.65;font-variant-numeric:tabular-nums}
.pill:hover{background:var(--surface-2);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--red);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.prod{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:6px 18px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);transition:background .15s}
.prod:last-child{border-bottom:0}
.prod.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--red)}
.prod.blocked{opacity:.55}
.tile{width:64px;height:64px;border-radius:8px;display:grid;place-items:center}
.tile svg{width:24px;height:24px}
.prod h3{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.prod .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.price{text-align:right}
.price b{font-size:15px;font-weight:600}
.price span{display:block;font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:6px;padding:3px}
.stepper button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;font-size:17px;font-weight:600;color:var(--muted);display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:var(--surface);color:var(--ink)}
.stepper input{width:64px;height:30px;border:0;background:transparent;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;outline:0}
.stepper input::placeholder{color:var(--faint);font-weight:500}
.prod-foot{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;margin-top:4px}
.pbar{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.pbar i{width:10px;height:14px;border-radius:2px;background:var(--surface-3);position:relative;overflow:hidden;display:block}
.pbar i span{position:absolute;inset:auto 0 0 0;display:block}
.note{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.note::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.note.ok{color:var(--ok)}.note.warn{color:var(--warn)}.note.err{color:var(--err)}
.link{border:0;background:transparent;padding:0;color:var(--accent-text);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
@media (max-width:640px){
  .prod{grid-template-columns:44px minmax(0,1fr);padding:14px 16px}
  .tile{width:44px;height:44px}
  .price{text-align:left;grid-column:2}
  .stepper{grid-column:2;justify-self:start}
  .prod-foot{grid-column:1/-1}
}

/* ---------- painel embarque ---------- */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:1040px){.panel{position:static}}
.p-sec{padding:18px 20px;display:grid;gap:12px}
.p-sec + .p-sec{border-top:1px solid var(--line)}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p-head h2{font-size:18px}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:var(--red)}
.switch input:checked::after{left:16px}
.status{display:flex;align-items:center;gap:12px}
.ring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring svg{width:18px;height:18px}
.status b{display:block;font-size:16px;letter-spacing:-.01em}
.status small{font-size:13px;color:var(--muted)}
.st-full .ring{background:var(--ok-soft);color:var(--ok)}
.st-partial .ring{background:var(--warn-soft);color:var(--warn)}
.st-excess .ring{background:var(--err-soft);color:var(--err)}
.st-empty .ring{background:var(--surface-2);color:var(--faint)}
.st-excess b{color:var(--err)}
.truck{position:relative;background:var(--surface-2);border-radius:8px}
.truck svg{width:100%;height:auto;display:block}
.meters{display:grid;gap:12px}
.meter{display:grid;gap:6px}
.meter .top-row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.meter .top-row span:first-child{color:var(--muted);font-weight:500}
.meter .top-row b{font-weight:600}
.meter .bar{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.meter .bar span{display:block;height:100%;border-radius:999px;background:var(--faint)}
.meter .bar.bind span{background:var(--ink)}
.meter .bar.over span{background:var(--err)}
.bindtag{font-size:13px;font-weight:600;color:var(--ink);background:var(--surface-2);padding:1px 6px;border-radius:999px;margin-left:4px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;font-size:13px;padding:10px 12px;border-radius:6px;line-height:1.4}
.alert.err{background:var(--err-soft);color:var(--err)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.tip{background:var(--surface-2);color:var(--ink)}
.alert.okb{background:var(--ok-soft);color:var(--ok)}
.alert .ic{width:16px;height:16px;flex:none}
.alert button{margin-left:auto;flex:none;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.value{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat .label{display:block}
.stat b{font-size:15px;font-weight:600;display:block}
.fam{display:grid;gap:6px;font-size:13px}
.fam div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.fam span:nth-child(2),.fam span:nth-child(3){text-align:right;color:var(--muted)}
.btn{border:0;border-radius:6px;padding:13px 20px;font-weight:600;letter-spacing:.02em;font-size:14.5px;background:var(--red);color:var(--on-red);width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover:not(:disabled){background:var(--red-hover)}
.btn:disabled{opacity:.4}
.btn.dark{background:var(--coffee);color:#fff}
.btn.sm{width:auto;padding:10px 16px;font-size:13.5px}
.btn-soft{border:0;background:var(--surface-2);border-radius:6px;padding:9px 14px;font-weight:600;font-size:13px}
.btn-soft:hover{background:var(--surface-3)}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,10,8,.45);backdrop-filter:blur(2px);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:calc(100% - 24px);overflow:auto;display:grid;gap:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.x{width:34px;height:34px;border-radius:6px;border:0;background:var(--surface-2);font-size:16px;flex:none}
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.r,table.data th.r{text-align:right}
table.data tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.info b{display:block;font-weight:600}
.field{display:grid;gap:6px}
.field input{border:0;background:var(--surface-2);border-radius:6px;padding:10px 12px;outline:0}
.field input:focus{box-shadow:0 0 0 2px var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.err{background:var(--err-soft);color:var(--err)}.chip.neutral{background:var(--surface-2);color:var(--ink)}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.timeline div{display:grid;gap:8px;font-size:13px;color:var(--faint);font-weight:500}
.timeline div::before{content:"";height:4px;border-radius:999px;background:var(--surface-3)}
.timeline div.done{color:var(--ink);font-weight:600}
.timeline div.done::before{background:var(--red)}
.success{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success svg{width:26px;height:26px}

/* ---------- exportação ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.kpi{padding:18px 20px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi b{display:block;font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.exp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.exp{grid-template-columns:minmax(0,1fr)}}
.olist{display:grid;padding:6px}
.orow{text-align:left;border:0;background:transparent;border-radius:8px;padding:12px 14px;display:grid;gap:4px;width:100%}
.orow:hover{background:var(--surface-2)}
.orow[aria-pressed="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--red)}
.orow .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.orow .id{font-weight:600}
.orow .r3{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h3{font-size:22px}
.callout{background:var(--red-soft);color:var(--ink);border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.5}
.callout b{color:var(--accent-text)}
.mini-in{width:80px;border:0;background:var(--surface-2);border-radius:8px;padding:6px 8px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mini-in:disabled{background:transparent}
pre.csv{background:var(--surface-2);border-radius:8px;padding:14px;font-family:var(--mono);font-size:13px;overflow-x:auto;margin:0;white-space:pre;line-height:1.6}
.audit{display:grid}
.audit div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.audit div:last-child{border-bottom:0}
.audit time{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.sec-title{font-size:13px;font-weight:600;margin-bottom:6px}

/* ---------- base ---------- */
td.div{color:var(--err);font-weight:600;background:var(--err-soft)}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;counter-reset:s}
.road div{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:6px;align-content:start}
.road div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:13px}
.road div.now::before{background:var(--red);color:var(--on-red)}
.road b{font-size:15px}
.road span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.rules{display:grid;gap:8px;font-size:13.5px}
.rules div{display:flex;gap:10px}
.rules div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);margin-top:8px;flex:none}
/* ---------- áreas ---------- */
:root{--admin-bg:#25282D;--admin-fg:#FFFFFF;--admin-muted:rgba(255,255,255,.62);--admin-seg:rgba(255,255,255,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--admin-bg:#0B0C0E}}
:root[data-theme="dark"]{--admin-bg:#0B0C0E}
.top.admin{background:var(--admin-bg);color:var(--admin-fg);border-bottom-color:transparent;backdrop-filter:none}
.top.admin .seg{background:var(--admin-seg)}
.top.admin .seg button{color:var(--admin-muted)}
.top.admin .seg button:hover{color:var(--admin-fg)}
.top.admin .seg button[aria-pressed="true"]{background:var(--red);color:#fff}

/* ============ MOTOR DE CÁLCULO ============ */
function calc(qty,o){
  const vb=VEH[o.veh]||VEH[bigVeh()], v=o.vsnap?{...vb,...o.vsnap,cols:Math.ceil(o.vsnap.pos/2)}:vb, cl=CLIENTS[o.client];
  const lines=[]; const tot={cx:0,pallets:0,net:0,gross:0,m3:0,value:0,positions:0};
  for(const p of P){
    const raw=Math.max(0,qty[p.code]||0); if(raw<EPS) continue;
    const isInt=Math.abs(raw-Math.round(raw))<1e-6; const cx=isInt?Math.round(raw):Math.ceil(raw);
    const pallets=cx/p.cxPal, full=Math.floor(pallets+EPS), frac=pallets-full;
    const hasFrac=frac>EPS;
    const missing=hasFrac?Math.ceil(p.cxPal*(full+1)-cx-EPS):0;
    const price=priceFor(p,o.client);
    const l={p,cx,pallets,full,frac:hasFrac?frac:0,missing,net:cx*p.net,gross:cx*p.gross,m3:cx*p.m3,price,value:cx*price,issues:[]};
    if(!isInt) l.issues.push({lv:"err",k:"boxMult",raw,lo:Math.floor(raw),hi:Math.ceil(raw)});
    if(cl.blocked.includes(p.code)) l.issues.push({lv:"err",k:"blocked"});
    if(p.off) l.issues.push({lv:"err",k:"inactive"});
    if(p.price==null&&!(p.prices&&p.prices[cl.list]!=null)) l.issues.push({lv:"err",k:"noPrice"});
    if(pallets+EPS<p.loteMin) l.issues.push({lv:RULES.minLotBlock?"err":"warn",k:"belowMin",v:p.loteMin});
    if(hasFrac && o.mode==="pal") l.issues.push({lv:RULES.fullPalBlock?"err":"warn",k:"missing",v:missing,n:full+1});
    lines.push(l);
    tot.cx+=cx; tot.pallets+=pallets; tot.net+=l.net; tot.gross+=l.gross; tot.m3+=l.m3; tot.value+=l.value;
    tot.positions+=Math.ceil(pallets-EPS);
  }
  if(o.mixed) tot.positions=Math.ceil(tot.pallets-EPS);
  const u={kg:tot.gross/v.kg, m3:tot.m3/v.m3, pos:o.mode==="pal"?tot.positions/v.pos:0};
  const keys=o.mode==="pal"?["kg","m3","pos"]:["kg","m3"];
  const bind=keys.reduce((a,b)=>u[b]>u[a]?b:a,keys[0]);
  const maxU=u[bind];
  const status=!lines.length?"empty":maxU>1+EPS?"excess":maxU>=RULES.fullAt?"full":"partial";
  const over={pos:o.mode==="pal"?Math.max(0,tot.positions-v.pos):0,kg:Math.max(0,tot.gross-v.kg),m3:Math.max(0,tot.m3-v.m3)};
  const blocking=!lines.length||lines.some(l=>l.issues.some(i=>i.lv==="err"))||status==="excess";
  const fams={}; lines.forEach(l=>{const f=l.p.fam;fams[f]=fams[f]||{kg:0,val:0,pal:0};fams[f].kg+=l.net;fams[f].val+=l.value;fams[f].pal+=l.pallets});
  return {lines,tot,u,bind,status,over,v,blocking,fams,maxU,mode:o.mode,mixed:!!o.mixed,veh:o.veh};
}

/* ============ RASCUNHOS (vários por cliente) ============ */
/* S.qty, S.veh, S.mode e S.unit são a cópia de trabalho do rascunho ativo; syncDraft grava de volta a cada render. */
const newDraftId=()=>"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const myDrafts=()=>S.drafts.filter(d=>d.client===S.client);
const hasItems=d=>Object.keys(d.qty||{}).length>0;
function syncDraft(){const d=S.drafts.find(x=>x.id===S.draftId);if(!d||d.client!==S.client)return;const nq=JSON.stringify(S.qty);if(JSON.stringify(d.qty)!==nq||d.veh!==S.veh||d.mode!==S.mode)d.updated=Date.now();d.qty=JSON.parse(nq);d.unit={...S.unit};d.veh=S.veh;d.mode=S.mode}
function useDraft(id){syncDraft();const d=S.drafts.find(x=>x.id===id);if(!d)return;S.draftId=d.id;S.client=d.client;S.qty={...d.qty};S.unit={...(d.unit||{})};S.veh=vehOn(d.veh)?d.veh:bigVeh();S.mode=d.mode==="est"?"est":"pal"}
function autoDraftName(){const n=myDrafts().length+1;return tr(`Rascunho ${n}`,`Borrador ${n}`,`Draft ${n}`)}
function createDraft(name,qty,veh,mode){
  syncDraft();
  S.drafts=S.drafts.filter(d=>d.client!==S.client||hasItems(d)); /* não acumula rascunhos vazios */
  const d={id:newDraftId(),client:S.client,name:String(name||autoDraftName()).slice(0,40),qty:{...(qty||{})},unit:{},veh:vehOn(veh)?veh:bigVeh(),mode:mode==="est"?"est":"pal",created:Date.now(),updated:Date.now()};
  S.drafts.unshift(d); S.draftId=null; useDraft(d.id); return d;
}
function deleteDraft(id){
  const i=S.drafts.findIndex(x=>x.id===id); if(i<0)return;
  S.drafts.splice(i,1);
  if(S.draftId===id){S.draftId=null;const next=myDrafts().filter(hasItems).sort((a,b)=>b.updated-a.updated)[0];if(next)useDraft(next.id);else createDraft()}
}
function ensureDraft(){
  const cur=S.drafts.find(d=>d.id===S.draftId);
  if(cur&&cur.client===S.client)return;
  if(cur)syncDraftTo(cur);
  const mine=myDrafts().sort((a,b)=>b.updated-a.updated)[0];
  S.draftId=null; if(mine)useDraft(mine.id); else createDraft();
}
/* grava a cópia de trabalho no rascunho de origem quando a conta muda */
function syncDraftTo(d){d.qty={...S.qty};d.unit={...S.unit};d.veh=S.veh;d.mode=S.mode}
function consumeDraft(){const i=S.drafts.findIndex(d=>d.id===S.draftId);if(i>=0)S.drafts.splice(i,1);S.draftId=null;createDraft()}
function ago(ms){const m=Math.max(0,Math.round((Date.now()-(ms||Date.now()))/60000));if(m<1)return tr("agora","ahora","just now");if(m<60)return tr(`há ${m} min`,`hace ${m} min`,`${m} min ago`);const h=Math.round(m/60);if(h<24)return tr(`há ${h} h`,`hace ${h} h`,`${h} h ago`);const d=Math.round(h/24);return tr(`há ${d} dia${d>1?"s":""}`,`hace ${d} día${d>1?"s":""}`,`${d} day${d>1?"s":""} ago`)}

/* ---------- Pallet do produto (3D + desenho 2D de reserva) ---------- */
function palLayout(n,c,w){let best=null;for(const [bx,bz] of [[c,w],[w,c]])for(let nx=1;nx<=n;nx++){const nz=Math.ceil(n/nx),sx=nx*bx,sz=nz*bz,score=(Math.max(0,sx-1.2)+Math.max(0,sz-1))*10+Math.abs(sx-1.2)+Math.abs(sz-1);if(!best||score<best.score)best={nx,nz,bx,bz,score}}return best}
function palletHTML(p,lastro,alt,pt){
  const tx=(a,b,c)=>pt?a:tr(a,b,c), d=String(p.dims||"300×200×150").split("×").map(v=>parseInt(v,10)/1000), bh=d[2]||0.15;
  const lay=palLayout(lastro,d[0]||0.3,d[1]||0.2), H=0.144+alt*bh, cx=lastro*alt, color=cssVar(FAM[p.fam]?FAM[p.fam].c:"--faint");
  const S2=120, k=S2/1.2, cells=[]; const ox=(S2-lay.nx*lay.bx*k)/2, oz=(100-lay.nz*lay.bz*k)/2;
  for(let i=0;i<lastro;i++){const ix=i%lay.nx,iz=Math.floor(i/lay.nx);cells.push(`<rect x="${(ox+ix*lay.bx*k+.6).toFixed(1)}" y="${(oz+iz*lay.bz*k+.6).toFixed(1)}" width="${(lay.bx*k-1.2).toFixed(1)}" height="${(lay.bz*k-1.2).toFixed(1)}" rx="1" fill="${color}"/>`)}
  const layers=[]; const lh=Math.min(10,80/alt); for(let i=0;i<alt;i++)layers.push(`<rect x="4" y="${(92-(i+1)*lh).toFixed(1)}" width="52" height="${(lh-1).toFixed(1)}" rx="1" fill="${color}"/>`);
  const cap=tx(`Pallet PBR 1,20 × 1,00 m · ${lastro} cx por camada × ${alt} camadas = ${fmtPT(cx,0)} cx · altura ≈ ${fmtPT(H,2)} m`,`Pallet PBR 1,20 × 1,00 m · ${lastro} cajas por capa × ${alt} capas = ${fmt(cx,0)} cajas · altura ≈ ${fmt(H,2)} m`,`PBR pallet 1.20 × 1.00 m · ${lastro} boxes per layer × ${alt} layers = ${fmt(cx,0)} boxes · height ≈ ${fmt(H,2)} m`);
  return `<figure class="palfig" data-pal3d="${p.code}" data-lastro="${lastro}" data-alt="${alt}" data-dims="${esc(p.dims||"")}" data-color="${color}">
    <div class="pal-3d"><span class="pal-hint" aria-hidden="true">${tx("Arraste para girar","Arrastra para girar","Drag to rotate")}</span></div>
    <div class="pal-2d" role="img" aria-label="${esc(cap)}"><svg viewBox="0 0 120 100" aria-hidden="true"><rect x="0" y="0" width="120" height="100" rx="3" fill="var(--tone-3)"/>${cells.join("")}</svg><svg viewBox="0 0 60 100" aria-hidden="true"><rect x="2" y="92" width="56" height="6" rx="1" fill="#c29a6b"/>${layers.join("")}</svg></div>

/* ---------- qualidade do cadastro: SAP (fonte usada) x Order Basis (planilha de hoje) ---------- */
const QCAT={kg:"Peso por caixa",pal:"Paletização",price:"Preço",lot:"Lote mínimo"};
function qualityIssues(){
  const out=[], d=(a,b,tol)=>Math.abs(a-b)>(tol||0.011), f=v=>fmtPT(v,v%1?2:0);
  P.forEach(p=>{const o=p.ob;if(!o)return;
    if(d(o.cxPal,p.cxPal))out.push({p,cat:"pal",imp:"carga",t:`Caixas por pallet: a Order Basis usa ${f(o.cxPal)}, mas o SAP tem ${p.cxPal} (${p.lastro} caixas × ${p.alt} camadas).`,use:`${p.cxPal} cx por pallet`});
    if(d(o.palz,p.cxPal))out.push({p,cat:"pal",imp:"carga",t:`A aba de paletização da planilha traz ${f(o.palz)} cx por pallet${o.palz%1?", um valor quebrado":""}; o SAP tem ${p.cxPal}.`,use:`${p.cxPal} cx por pallet`});
    if(p.priceSrc==="manual")out.push({p,cat:"price",imp:"valor",t:`Sem preço vigente no SAP: a Order Basis usa US$ ${fmtPT(o.price)}, digitado à mão.`,use:`US$ ${fmtPT(p.price)} manual, até o SAP ter preço`});
    else if(d(o.price,p.price))out.push({p,cat:"price",imp:"valor",t:`Preço: a Order Basis usa US$ ${fmtPT(o.price)}, mas o SAP tem US$ ${fmtPT(p.price)}.`,use:`US$ ${fmtPT(p.price)}`});
    if(d(o.lote,p.loteMin))out.push({p,cat:"lot",imp:"carga",t:`Lote mínimo: a Order Basis pega ${f(o.lote)}, o primeiro valor que encontra (filial BHO); para Londrina o SAP tem ${f(p.loteMin)} pallet${p.loteMin>1?"s":""}.`,use:`${f(p.loteMin)} pallet${p.loteMin>1?"s":""}`});
    if(d(o.grossCx,p.gross,0.05)){const r=o.grossCx/p.gross;
      out.push({p,cat:"kg",imp:"carga",t:r>3?`Peso bruto por caixa: a Order Basis usa ${fmtPT(o.grossCx,2)} kg, quase ${Math.round(r)} vezes o do SAP (${fmtPT(p.gross,2)} kg). A unidade cadastrada é o display, não o stick.`:o.grossCx<p.gross?`Peso bruto por caixa: a Order Basis usa ${fmtPT(o.grossCx,2)} kg porque soma só o produto e ignora a caixa de papelão; o SAP tem ${fmtPT(p.gross,2)} kg.`:`Peso bruto por caixa: a Order Basis usa ${fmtPT(o.grossCx,2)} kg, mas o SAP tem ${fmtPT(p.gross,2)} kg.`,use:`${fmtPT(p.gross,2)} kg por caixa`})}
  });
  return out;
}

/* Monta os pallets do pedido: cheios primeiro, depois as sobras (juntas só se o cliente aceita pallet misto). */
function palletUnits(r){
  const units=[]; if(r.mode!=="pal") return units;
  r.lines.forEach(l=>{for(let i=0;i<l.full;i++)units.push([{f:1,p:l.p}])});
  const fr=r.lines.filter(l=>l.frac>EPS).map(l=>({f:l.frac,p:l.p}));
  if(r.mixed){let cur=[],acc=0;fr.forEach(x=>{let rem=x.f;while(rem>1e-6){const take=Math.min(rem,1-acc);cur.push({f:take,p:x.p});acc+=take;rem-=take;if(acc>=1-1e-6){units.push(cur);cur=[];acc=0}}});if(cur.length)units.push(cur)}
  else fr.forEach(x=>units.push([x]));
  return units;
}
function truckBox(r,kind){
  const tx=k=>(kind==="adm"?T.pt:T[S.lang])[k];
  const units=palletUnits(r), out=r.mode==="pal"?Math.max(0,units.length-r.v.pos):0;
  const can=v3Supported(), on=can&&S.view3d!=="2d";
  const tag=out?`<span class="v3d-tag">${tx("v3dOut")(out)}</span>`:(r.mode==="est"&&r.u.m3>1+EPS?`<span class="v3d-tag">${tx("st_excess")}</span>`:"");
  return `<div class="truck ${on?"is3d":""}" data-truck>
    ${can?`<div class="v3d ${kind}" data-v3d="${kind}"><div class="v3d-ui"><button class="v3d-btn" data-view3d="2d" title="${tx("view2d")}" aria-label="${tx("view2d")}">2D</button><button class="v3d-btn" data-v3big="${kind}" title="${tx("v3dExpand")}" aria-label="${tx("v3dExpand")}">${SVG.expand}</button></div>${tag}${V3.hinted?"":`<span class="v3d-hint">${tx("v3dHint")}</span>`}</div>`:""}
    <div class="t2d">${truckSVG(r)}${can?`<button class="v3d-btn t3" data-view3d="3d" title="3D" aria-label="3D">3D</button>`:""}</div>
  </div>`;
}
function truckSVG(r){
  const v=r.v, cols=v.cols, cw=30, ch=26, gap=3, padX=v.cab?52:4, padY=4;
  const trailerW=cols*(cw+gap)+gap, trailerH=2*(ch+gap)+gap;
  const units=palletUnits(r).map(u=>u.map(s=>({f:s.f,c:famColor(s.p.fam)})));
  const extra=Math.max(0,units.length-v.pos), extraCols=Math.ceil(extra/2);
  const W=padX+trailerW+(extraCols?extraCols*(cw+gap)+14:0)+4, H=trailerH+padY*2+(extra?14:0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("positions")}: ${r.tot.positions}/${v.pos}">`;
  if(v.cab)s+=`<rect x="4" y="${padY+5}" width="40" height="${trailerH-10}" rx="10" fill="var(--surface)" stroke="var(--surface-3)" stroke-width="1.5"/><rect x="9" y="${padY+11}" width="10" height="${trailerH-22}" rx="3" fill="var(--surface-3)"/>`;
  s+=`<rect x="${padX}" y="${padY}" width="${trailerW}" height="${trailerH}" rx="6" fill="var(--surface)" stroke="var(--surface-3)" stroke-width="1.5"/>`;
  if(r.mode==="est"){
    const fillW=Math.min(1,r.u.m3)*(trailerW-6); let x=padX+3; const tot=r.tot.m3||1;
    r.lines.forEach(l=>{const w=fillW*(l.m3/tot);s+=`<rect x="${x}" y="${padY+3}" width="${Math.max(0,w)}" height="${trailerH-6}" fill="${famColor(l.p.fam)}"/>`;x+=w});
    for(let gx=padX+3+10;gx<padX+3+fillW;gx+=10)s+=`<line x1="${gx}" y1="${padY+3}" x2="${gx}" y2="${padY+trailerH-3}" stroke="var(--surface)" stroke-opacity=".5"/>`;
  } else {
    for(let i=0;i<Math.max(v.pos,units.length);i++){
      const inside=i<v.pos, col=inside?Math.floor(i/2):Math.floor((i-v.pos)/2), row=i%2;
      const x=inside?padX+gap+col*(cw+gap):padX+trailerW+14+col*(cw+gap), y=padY+gap+row*(ch+gap);
      s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="3" fill="${inside?"var(--surface-2)":"none"}" ${inside?"":'stroke="var(--err)" stroke-dasharray="3 2" stroke-width="1.5"'}/>`;
      const u=units[i]; if(u){let yy=y+ch;u.forEach(seg=>{const h=ch*seg.f;yy-=h;s+=`<rect x="${x}" y="${yy}" width="${cw}" height="${h}" rx="${seg.f>.95?3:1}" fill="${seg.c}" ${inside?"":'opacity=".45"'}/>`})}
    }
    if(extra)s+=`<text x="${padX+trailerW+14}" y="${H-1}" font-size="10" font-weight="700" font-family="var(--font)" fill="var(--err)">+${extra}</text>`;
  }
  return s+`</svg>`;
}

function meter(label,val,cap,unit,u,isBind,d=0){
  const pct=Math.min(u,1)*100, over=u>1+EPS;
  return `<div class="meter"><div class="top-row"><span>${label}${isBind?`<span class="bindtag">${t("bind")}</span>`:""}</span><span class="num"><b style="${over?"color:var(--err)":""}">${fmt(val,d)}</b> / ${fmt(cap,d)} ${unit}</span></div>
  <div class="bar ${over?"over":isBind?"bind":""}"><span style="width:${pct}%"></span></div></div>`;
}

function suggestions(r){
  const out=[]; if(!r.lines.length||S.mode!=="pal") return out;
  const v=r.v;
  if(r.status==="excess"&&r.over.pos>0){
    const big=[...r.lines].sort((a,b)=>b.pallets-a.pallets)[0];
    out.push({txt:t("sugCut")(r.over.pos,big.p[S.lang]),act:`cut:${big.p.code}:${r.over.pos}`});
  } else if(r.status!=="excess"){
    const free=v.pos-r.tot.positions;
    if(r.lines.some(l=>l.frac>EPS)) out.push({txt:t("sugRound"),act:"round"});
    else if(free>=1){
      const ok=r.lines.filter(l=>!l.p.off&&!CLIENTS[S.client].blocked.includes(l.p.code)).sort((a,b)=>b.cx-a.cx);
      for(const l of ok){const add=free*l.p.cxPal;if(r.tot.gross+add*l.p.gross<=v.kg&&r.tot.m3+add*l.p.m3<=v.m3){out.push({txt:t("sugAdd")(free,l.p[S.lang]),act:`add:${l.p.code}:${free}`});break}}
    }
  }
  return out;
}

/* Edição em rascunho: nada muda até "Salvar e aplicar". Antes de salvar, o painel mostra o impacto nos pedidos em análise.

const PFIELD={
  "rules.fullAt":{min:0.5,max:1,label:"Carga completa",scale:100,unit:"%"},
  "rules.leadDays":{min:0,max:60,int:true,label:"Prazo mínimo de carregamento",unit:"dias"},
  "rules.lateH":{min:1,max:72,label:"Alerta de fila",unit:"h"},
  "veh.*.pos":{min:1,max:60,int:true,label:"Posições de pallet"},
  "veh.*.kg":{min:500,max:60000,label:"Peso máximo",unit:"kg"},
  "veh.*.m3":{min:1,max:150,label:"Cubagem",unit:"m³"},
  "prod.*.lastro":{min:1,max:60,int:true,label:"Lastro"},
  "prod.*.alt":{min:1,max:30,int:true,label:"Camadas"},
  "prod.*.loteMin":{min:0,max:50,label:"Lote mínimo",unit:"pallets"},
  "prod.*.gross":{min:0.01,max:100,label:"Peso bruto por caixa",unit:"kg"}
};
const PBOOL=new Set(["rules.minLotBlock","rules.fullPalBlock"]);
function pfield(path){const [a,,c]=path.split(".");return PFIELD[path]||PFIELD[a+".*."+c]}
function pvalidate(path,v){
  const [a,b,c]=String(path).split(".");
  if(a==="veh"&&b!=="__new"&&!VEH[b])return "Veículo não encontrado";
  if(a==="prod"&&!BY[b])return "Produto não encontrado";
  if(a==="block")return CLIENTS[b]&&BY[c]?(typeof v==="boolean"?"":"Valor inválido"):"Cadastro não encontrado";
  if(PBOOL.has(path)||(a==="veh"&&c==="active")||(a==="prod"&&c==="off"))return typeof v==="boolean"?"":"Valor inválido";
  if(a==="veh"&&["pt","es","en"].includes(c))return typeof v==="string"&&v.trim()&&v.trim().length<=40?"":"Informe um nome com até 40 caracteres";
  if(a==="veh"&&c==="kind")return v==="trailer"||v==="container"?"":"Tipo inválido";
  if(a==="rules"&&!(b in RULES_DEF))return "Regra desconhecida";
  const f=pfield(path); if(!f)return "Parâmetro desconhecido";
  if(typeof v!=="number"||!isFinite(v))return `${f.label}: informe um número`;
  if(f.int&&!Number.isInteger(v))return `${f.label}: use um número inteiro`;
  const sc=f.scale||1;
  if(v<f.min-1e-9||v>f.max+1e-9)return `${f.label}: entre ${nf(f.min*sc)} e ${nf(f.max*sc)}${f.unit?" "+f.unit:""}`;
  return "";
}
function pget(path){const [a,b,c]=path.split(".");
  if(a==="rules")return RULES[b];
  if(a==="veh")return c==="active"?VEH[b].active!==false:c==="kind"?(VEH[b].kind||"trailer"):VEH[b][c];
  if(a==="prod")return c==="off"?!!BY[b].off:BY[b][c];
  if(a==="block")return CLIENTS[b].blocked.includes(c);
}
function pset(path,v){const [a,b,c]=path.split(".");
  if(a==="rules")RULES[b]=v;
  else if(a==="veh"){const x=VEH[b];x[c]=v;if(c==="pos")x.cols=Math.ceil(v/2);if(c==="kind")x.cab=v==="trailer"}
  else if(a==="prod"){const p=BY[b];p[c]=v;if(c==="lastro"||c==="alt")p.cxPal=p.lastro*p.alt}
  else if(a==="block"){const cl=CLIENTS[b];cl.blocked=cl.blocked.filter(x=>x!==c);if(v)cl.blocked.push(c)}
}
const psame=(a,b)=>typeof a==="number"&&typeof b==="number"?Math.abs(a-b)<1e-9:a===b;
const pv=(path,cur)=>path in S.pd?S.pd[path]:cur;
function pdesc(x){const [a,b,c]=x.p.split(".");
  if(a==="rules"){const L={fullAt:"carga completa a partir de",leadDays:"prazo mínimo de carregamento",lateH:"alerta de pedido parado na fila",minLotBlock:"lote mínimo",fullPalBlock:"pallet incompleto"}[b];
    const f=v=>b==="fullAt"?nf(v*100)+"%":b==="leadDays"?nf(v)+" dias":b==="lateH"?nf(v)+" h":v?"bloqueia o envio":"só alerta";
    return `Regra: ${L} ${f(x.old)} → ${f(x.v)}`}
  if(a==="veh"){const n=VEH[b]?VEH[b].pt:b;
    if(c==="active")return `${n}: ${x.v?"disponível para os clientes":"retirado de uso"}`;
    if(c==="kind")return `${n}: tipo ${x.v==="container"?"contêiner":"caminhão"}`;
    if(["pt","es","en"].includes(c))return `Veículo: nome ${({pt:"em português",es:"em espanhol",en:"em inglês"})[c]} ${x.old} → ${x.v}`;
    return `${n}: ${({pos:"posições de pallet",kg:"peso máximo (kg)",m3:"cubagem (m³)"})[c]} ${nf(x.old)} → ${nf(x.v)}`}
  if(a==="prod"){const p=BY[b];if(c==="off")return `${p.pt}: ${x.v?"retirado do catálogo":"voltou ao catálogo"}`;
    return `${p.pt}: ${({lastro:"lastro (cx por camada)",alt:"camadas por pallet",loteMin:"lote mínimo (pallets)",gross:"peso bruto por caixa (kg)"})[c]} ${nf(x.old)} → ${nf(x.v)}${c==="lastro"||c==="alt"?` · ${p.cxPal} cx/pallet`:""}`}
  if(a==="block")return `${CLIENTS[b].name}: ${BY[c].pt} ${x.v?"bloqueado para o destino":"liberado para o destino"}`;
  return x.p;
}
/* Aplica o rascunho de parâmetros só durante fn (simulação de impacto) e devolve tudo como estava */
function withSettings(pd,fn){const back=Object.keys(pd).map(p=>[p,pget(p)]);try{Object.entries(pd).forEach(([p,v])=>pset(p,v));return fn()}finally{back.reverse().forEach(([p,v])=>pset(p,v))}}
function paramImpact(pd){
  const open=S.orders.filter(o=>o.status==="analise"), before=open.map(o=>calc(o.qty,o));

    if(r0.status!==r1.status||r0.blocking!==r1.blocking)ch.push({id:o.id,from:r0.status,to:r1.status,b0:r0.blocking,b1:r1.blocking,p0:r0.maxU,p1:r1.maxU});

    return {orders:ch,pct,open:open.length}});
}

const fmtIn=x=>{const r=Math.round(x*1000)/1000;return Number.isInteger(r)?String(r):String(r).replace(".",",")};

const IMP={files:[],preview:null,log:[],error:""};
const KIND={conferencia:"Conferência de produtos",materiais:"Materiais",registros:"Registros (preços)",desconhecido:"Não reconhecido",erro:"Erro de leitura"};
function num(v){if(typeof v==="number")return v;if(v==null||v==="")return NaN;return parseNum(v)}
const ok=v=>typeof v==="number"&&isFinite(v)&&v>0;
function title(s){return String(s).toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase())}
function mapFam(s){const u=String(s||"").toUpperCase().trim();if(!u)return null;if(u.startsWith("CAF"))return "CAFES";if(u.startsWith("CAPP"))return "CAPPUCCINO";if(u.startsWith("SOL"))return "SOLUVEIS";if(u.startsWith("PORTA"))return "PORTA";if(u.startsWith("FILTRO"))return "FILTROS";return u}
function mapBrand(s){const u=String(s||"").toUpperCase();if(!u)return null;if(u.includes("IGUA"))return "Iguaçu";if(u.includes("GERAL")||u.startsWith("3C"))return "3corações";return title(u.replace(/\s*\(\d+\)/,""))}
function unLabel(sap,un){const m=String(sap).match(/(\d+(?:X\d+)*X[\d,]+)(G|KG|ML|UN)\b/i);if(m)return m[1].split(/X/i).join(" × ")+" "+m[2].toLowerCase();const c=String(sap).match(/C\/(\d+)/);if(c)return c[1]+" un";return (un||"?")+" un"}
async function readFiles(list){
  IMP.error="";
  if(!window.XLSX){try{await ensureXLSX()}catch(_){}}
  if(!window.XLSX){IMP.error="Não foi possível carregar o leitor de planilhas. Verifique a conexão e tente de novo.";render();return}
  const out=[];
  for(const f of list){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true});
      let hi=-1;for(let i=0;i<Math.min(rows.length,10);i++){if(rows[i].some(c=>String(c).trim()==="Material")){hi=i;break}}
      const head=hi>=0?rows[hi].map(h=>String(h).trim()):[]; const body=hi>=0?rows.slice(hi+1).filter(r=>r.some(c=>c!==""&&c!=null)):[];
      const kind=head.includes("UM alternativa")?"conferencia":head.includes("Lista de Preço")?"registros":head.includes("Lastro")?"materiais":"desconhecido";
      out.push({name:f.name,kind,head,body});
    }catch(e){out.push({name:f.name,kind:"erro",head:[],body:[]})}
  }
  IMP.files=out; IMP.preview=buildPreview(out); render();
}
function buildPreview(files){
  const conf=files.find(f=>f.kind==="conferencia"),mat=files.find(f=>f.kind==="materiais"),reg=files.find(f=>f.kind==="registros");
  if(!conf&&!mat&&!reg) return {items:[],msg:"Nenhuma extração reconhecida. Use os arquivos Conferência de produtos, Materiais ou Registros, como saem do SAP."};
  const R={}; const get=c=>R[c]=R[c]||{code:c,alerts:[]};
  if(mat){const h=mat.head,iM=h.indexOf("Material"),iD=h.indexOf("Descrição"),iL=h.indexOf("Lastro"),iA=h.indexOf("Altura");
    mat.body.forEach(r=>{const c=String(r[iM]).trim();if(!c)return;const x=get(c);x.sap=x.sap||String(r[iD]).trim();x.lastro=num(r[iL]);x.alt=num(r[iA])})}
  if(conf){const h=conf.head,iM=h.indexOf("Material"),iD=h.indexOf("Texto breve material"),iU=h.indexOf("UM alternativa"),iC=h.indexOf("Contador"),iJ=h.indexOf("Comprimento"),iK=h.indexOf("Largura"),iH=h.indexOf("Altura"),iV=h.indexOf("Volume"),iN=h.indexOf("Peso líquido"),iG=h.indexOf("Peso bruto"),iW=h.indexOf("Unidade de peso"),iS=h.indexOf("Prazo de validade"),iF=h.indexOf("Denominação"),iB=iF>=0?h.indexOf("Denominação",iF+1):-1,iLn=iB>=0?h.indexOf("Denominação",iB+1):-1,iE=h.indexOf("Código EAN/UPC"),iL=h.indexOf("Lastro"),iA=h.lastIndexOf("Altura");
    conf.body.forEach(r=>{const c=String(r[iM]).trim();if(!c)return;const x=get(c);x.sap=String(r[iD]).trim()||x.sap;x.famRaw=String(r[iF]||"").trim();if(iLn>=0&&r[iLn])x.linha=String(r[iLn]).trim();{const um=String(r[iU]).trim(),ean=iE>=0?String(r[iE]||"").trim():"";if(ean){if(um==="CX")x.dun=ean;else if((um==="UN"||um==="SCH")&&!x.ean)x.ean=ean}}x.brandRaw=iB>=0?String(r[iB]).trim():"";x.shelf=num(r[iS]);
      if(!ok(x.lastro)&&iL>=0){x.lastro=num(r[iL]);x.alt=num(r[iA])}
      if(String(r[iU]).trim()==="CX"){const k=String(r[iW]).trim().toUpperCase()==="G"?0.001:1;x.un=num(r[iC]);x.net=num(r[iN])*k;x.gross=num(r[iG])*k;x.dm3=num(r[iV]);x.dims=[r[iJ],r[iK],r[iH]].map(v=>Math.round(num(v))).join("×")}})}
  if(reg){const h=reg.head,iM=h.indexOf("Material"),iD=h.indexOf("Desc. Material"),iL=h.indexOf("Lista de Preço"),iP=h.indexOf("Preço Sugerido"),iDe=h.indexOf("Válido desde"),iAt=h.indexOf("Válido até"),iX=h.indexOf("Exclusão"),iMa=h.indexOf("Marca"),iFa=h.indexOf("Família");const now=new Date();
    reg.body.forEach(r=>{const c=String(r[iM]).trim();if(!c)return;if(Number(r[iX])===1)return;const de=r[iDe] instanceof Date?r[iDe]:null,at=r[iAt] instanceof Date?r[iAt]:null;if((de&&de>now)||(at&&at<now))return;
      const x=get(c);x.sap=x.sap||String(r[iD]).trim();x.prices=x.prices||{};x.pdate=x.pdate||{};const l=String(r[iL]).trim(),pr=num(r[iP]);if(!ok(pr))return;
      if(!x.pdate[l]||(de&&de>x.pdate[l])){x.prices[l]=pr;x.pdate[l]=de||new Date(0)}
      if(iMa>=0&&!x.brandRaw)x.brandRaw=String(r[iMa]);if(iFa>=0&&!x.famRaw)x.famRaw=String(r[iFa]).replace(/\s*\(\d+\)/,"")})}
  const items=[]; let skipped=0;
  Object.values(R).forEach(x=>{
    const cur=BY[x.code]; const alerts=[];

function hasPrice(p,cl){return !(p.price==null&&!(p.prices&&p.prices[cl.list]!=null))}
/* Pedido sugerido: mix do histórico do cliente, em pallets fechados, enchendo a carreta dentro de peso, cubagem e lote mínimo */
function suggestedOrder(){
  const cl=CLIENTS[S.client], hist=S.orders.filter(o=>o.client===S.client), w={};
  hist.forEach(o=>Object.entries(o.qty).forEach(([c,q])=>{const p=BY[c];if(p)w[c]=(w[c]||0)+q/p.cxPal}));
  let items=Object.entries(w).filter(([c])=>BY[c]&&!BY[c].off&&!cl.blocked.includes(c)&&hasPrice(BY[c],cl));
  if(!items.length)items=[["12031189",10],["12034103",4],["12142501",5],["12037417",3]].filter(([c])=>BY[c]&&!BY[c].off&&!cl.blocked.includes(c)&&hasPrice(BY[c],cl));
  const veh=bigVeh(), cap=VEH[veh].pos, tot=items.reduce((a,[,v])=>a+v,0)||1, o={client:S.client,veh,mode:"pal",mixed:!!cl.mixed};
  const al=items.map(([c,v])=>{const x=v/tot*cap;return {c,n:Math.floor(x),rem:x-Math.floor(x)}});
  let left=cap-al.reduce((a,x)=>a+x.n,0); [...al].sort((a,b)=>b.rem-a.rem).forEach(x=>{if(left>0){x.n++;left--}});
  al.forEach(x=>{if(x.n>0&&x.n<BY[x.c].loteMin)x.n=0});
  const mk=()=>{const q={};al.forEach(x=>{if(x.n>0)q[x.c]=x.n*BY[x.c].cxPal});return q};
  let q=mk(), r=calc(q,o), g=0;
  while(r.maxU>1+EPS&&g++<80){const big=[...al].sort((a,b)=>b.n-a.n)[0];big.n--;q=mk();r=calc(q,o)}
  /* posições liberadas pelo lote mínimo voltam para os itens do mix, enquanto couber */
  const live=al.filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  for(let k=0;k<40&&live.length;k++){let moved=false;for(const x of live){x.n++;const q2=mk(),r2=calc(q2,o);if(r2.maxU<=1+EPS){q=q2;r=r2;moved=true}else x.n--}if(!moved)break}
  return {qty:q,veh,r};
}
/* Completar carga: fecha pallets e acrescenta pallets cheios no mix atual enquanto couber */
function fillLoad(){

  const q={...S.qty};
  r.lines.forEach(l=>{if(l.frac>EPS)q[l.p.code]=Math.ceil(l.pallets-EPS)*l.p.cxPal});
  if(calc(q,base).maxU>1+EPS)Object.assign(q,S.qty);
  const cands=r.lines.filter(l=>!l.p.off&&!cl.blocked.includes(l.p.code)&&hasPrice(l.p,cl)).sort((a,b)=>b.pallets-a.pallets).map(l=>l.p);

}

function parseImpact(nq){

    if(!k){if(/\b40\b/.test(nq.replace(num[0],"")))k="c40";else if(/\b20\b/.test(nq.replace(num[0],"")))k="c20";else if(/conte|container/.test(nq))k="c40";else k="carreta"}
    if(VEH[k])pd[`veh.${k}.pos`]=Math.round(parseNum(num[1]))}
  const pc=nq.match(/(\d+(?:[.,]\d+)?)\s*%/); if(pc&&/complet|cheia|ocupa/.test(nq))pd["rules.fullAt"]=Math.round(parseNum(pc[1]))/100;

    const pd=parseImpact(nq), keys=Object.keys(pd);
    if(keys.length){const errs=keys.map(k=>pvalidate(k,pd[k])).filter(Boolean);if(errs.length)return A(`<p>Não dá para simular: ${esc(errs[0])}.</p>`,[],"alerta");
      const im=paramImpact(pd), desc=keys.map(k=>inPT(()=>pdesc({p:k,old:pget(k),v:pd[k]}))).map(x=>`<li>${esc(x)}</li>`).join("");
      return A(`<p>Simulei, sem alterar nada:</p><ul>${desc}</ul>${im.orders.length?`<p>Pedidos em análise que mudam:</p><ul>${im.orders.map(x=>`<li><b>${x.id}</b>: ${T.pt["st_"+x.from]} ${fmtPT(Math.round(x.p0*100),0)}% → ${T.pt["st_"+x.to]} ${fmtPT(Math.round(x.p1*100),0)}%${x.b1&&!x.b0?" · passa a ter bloqueio":!x.b1&&x.b0?" · fica sem bloqueio":""}</li>`).join("")}</ul>`:`<p>Nenhum pedido em análise muda de status${im.pct?`; ${im.pct} muda${im.pct>1?"m":""} de ocupação`:""}.</p>`}`,
        [["Levar para Parâmetros",`data-pfill="${esc(JSON.stringify(pd))}"`]],"pensando")}
  }
  /* bloqueios */
  if(has(/bloque\w*|trava\w*|impedi\w*|problema\w*|nao (posso|da para) aprovar/)){
    if(!d.blk.length)return A("<p>Nenhum pedido em análise está bloqueado. Todos podem ser aprovados.</p>",[],"comemorando");
    return A(`<p>${d.blk.length} pedido${d.blk.length>1?"s":""} bloqueado${d.blk.length>1?"s":""}:</p><ul>${d.blk.map(x=>`<li><b>${x.o.id}</b> · ${esc(CLIENTS[x.o.client].name)}: ${esc(inPT(()=>blockersOf(x.r)).slice(0,2).join("; "))}</li>`).join("")}</ul>`,d.blk.slice(0,3).map(x=>openAct(x.o.id)),"alerta")}
  /* parados */
  if(has(/parad\w*|atras\w*|esperando|aguard\w*|demor\w*|mais de \d+ ?h/)){
    if(!d.late.length)return A(`<p>Nenhum pedido espera há mais de ${nf(RULES.lateH)} h. A fila está dentro do prazo.</p>`,[],"comemorando");
    return A(`<p>${d.late.length} pedido${d.late.length>1?"s":""} esperando há mais de ${nf(RULES.lateH)} h:</p><ul>${d.late.map(admLine).join("")}</ul>`,d.late.slice(0,3).map(x=>openAct(x.o.id)),"alerta")}
  /* arquivo SAP */
  if(has(/\bsap\b|arquivo|csv|ordem de venda/)){
    return A(`<p>O arquivo para o SAP sai do detalhe do pedido: aprove e clique em <b>Gerar arquivo para o SAP</b>. Também dá para baixar o pedido no padrão Order Basis.</p>${d.noSap.length?`<p>Aprovados sem arquivo:</p><ul>${d.noSap.map(admLine).join("")}</ul>`:"<p>Todos os aprovados já têm arquivo gerado.</p>"}`,d.noSap.slice(0,3).map(x=>openAct(x.o.id)))}
  /* insights */
  if(has(/insight\w*|sugest\w*|oportunidad\w*|melhor\w*|recomend\w*|dica\w*|otimiz\w*|frete|aproveit\w*/)){
    return A(`<ul>${adminInsightsList(d.rs).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`,[["Ver Indicadores",'data-view="kpi"']])}
  /* clientes */
  if(has(/client\w*|distribuid\w*|pallet misto|aprovacao automatica/)){
    return A(`<ul>${Object.entries(CLIENTS).map(([k,c])=>{const n=S.orders.filter(o=>o.client===k).length;return `<li><b>${esc(c.name)}</b> · ${esc(c.dest)} · lista ${c.list} · ${n} pedido${n===1?"":"s"} · pallet misto ${c.mixed?"aceito":"não aceito"} · aprovação automática ${c.autoApprove?"ativa":"desligada"}${c.blocked.length?` · ${c.blocked.length} restrição${c.blocked.length>1?"ões":""}`:""}</li>`}).join("")}</ul>`,[["Abrir Clientes e preços",'data-view="clients"']])}
  /* qualidade de dados */
  if(has(/divergen\w*|qualidade|order basis|sem preco|dados do sap|catalogo/)){
    const di=dataIssues();return A(`<p>${di.div} divergência${di.div===1?"":"s"} entre SAP e Order Basis e ${di.noPrice} produto${di.noPrice===1?"":"s"} sem preço no SAP.</p><p>Os valores divergentes aparecem em vermelho em Catálogo e dados.</p>`,[["Abrir Catálogo e dados",'data-view="base"']],di.div?"alerta":"feliz")}
  /* regras e veículos */
  if(has(/parametr\w*|regra\w*|veicul\w*|carreta|conteiner|container|capacidade|posic\w*|lote minimo|prazo/)){
    return A(`<ul>${activeVeh().map(k=>`<li><b>${esc(VEH[k].pt)}</b>: ${VEH[k].pos} posições · ${fmtPT(VEH[k].kg,0)} kg · ${fmtPT(VEH[k].m3,2)} m³</li>`).join("")}</ul><p>Carga completa a partir de ${nf(RULES.fullAt*100)}% · prazo mínimo de ${RULES.leadDays} dias · lote mínimo ${RULES.minLotBlock?"bloqueia":"só alerta"} · pallet incompleto ${RULES.fullPalBlock?"bloqueia":"só alerta"}.</p>`,[["Abrir Parâmetros",'data-view="params"']])}
  /* produto */
  const pp=inPT(()=>pickProduct(nq));
  if(pp.p){const p=pp.p,inq=d.rs.filter(x=>x.o.qty[p.code]),pal=inq.reduce((a,x)=>a+(x.o.qty[p.code]||0)/p.cxPal,0);
    return A(`<p><b>${esc(p.pt)}</b> <span class="code">${p.code}</span></p><ul><li>${p.cxPal} cx/pallet (${p.lastro} × ${p.alt})</li><li>Lote mínimo ${nf(p.loteMin)} pallet${p.loteMin===1?"":"s"} · peso bruto ${fmtPT(p.gross,2)} kg/cx</li><li>Em carteira: ${fmtPT(pal)} pallets em ${inq.length} pedido${inq.length===1?"":"s"}</li>${p.off?"<li>Fora de linha</li>":""}</ul>`,[["Abrir Parâmetros",'data-view="params"']])}
  /* resumo da fila */
  if(has(/fila|pendent\w*|em analise|aprovar|resumo|hoje|situac\w*|status|visao geral|panorama|como esta/)||nq.length<4){
    if(!d.open.length)return A(`<p>Nenhum pedido em análise agora.${d.noSap.length?` ${d.noSap.length} aprovado${d.noSap.length>1?"s":""} aguardando arquivo SAP.`:""}</p>`,[],"comemorando");
    return A(`<p>${d.open.length} pedido${d.open.length>1?"s":""} em análise${d.blk.length?`, ${d.blk.length} bloqueado${d.blk.length>1?"s":""}`:""}:</p><ul>${d.open.map(admLine).join("")}</ul>${d.noSap.length?`<p>${d.noSap.length} aprovado${d.noSap.length>1?"s":""} sem arquivo SAP.</p>`:""}`,d.open.slice(0,3).map(x=>openAct(x.o.id)),d.blk.length?"alerta":"feliz")}
  if(/^(oi|ola|bom dia|boa tarde|boa noite)\b/.test(nq))return A("<p>Oi, Lucas! Quer o resumo da fila ou ver os bloqueios?</p>",[["Resumo da fila",'data-chatq="Resumo da fila"']]);
  if(/obrigad|valeu/.test(nq))return A("<p>Por nada! Qualquer coisa, estou por aqui.</p>");
  return A(`<p>Ainda não sei responder isso. Posso ajudar com:</p><ul><li>Resumo da fila e pedidos parados</li><li>Bloqueios e o que falta para aprovar</li><li>Simulação de parâmetros</li><li>Insights, clientes, produtos e qualidade de dados</li></ul>`,[],"pensando");
}

/* ============ CAMADA DE DADOS (espelha a API REST) ============ */
/* Cada método corresponde a um endpoint descrito no README. O servidor recalcula tudo com o mesmo motor:
   o navegador nunca é a fonte da verdade para preço, pallets ou ocupação. */
const FLOW={analise:["aprovado"],aprovado:["sap"],sap:["sap"]};
/* Pedido aprovado guarda a capacidade do veículo usada na aprovação: mudar um parâmetro depois não reescreve o passado */
const vsnapOf=k=>{const v=VEH[k];return v?{pos:v.pos,kg:v.kg,m3:v.m3}:undefined};
class ApiError extends Error{constructor(status,msg,details){super(msg);this.status=status;this.details=details||[]}}
const RLOG=[];
const actorClient=()=>`${CLIENTS[S.client].contact} (${CLIENTS[S.client].name})`, ACTOR_EXP="Lucas (Exportação)";
const stamp=()=>({at:nowStamp(),ts:new Date().toISOString()});
function nextId(){const n=S.orders.reduce((a,o)=>Math.max(a,parseInt(String(o.id).split("-").pop(),10)||0),0)+1;return "3CC-2026-"+String(n).padStart(4,"0")}
function draft(){return {client:S.client,veh:S.veh,mode:S.mode,mixed:!!CLIENTS[S.client].mixed,qty:S.qty}}
function isoLocal(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function minDate(){const d=new Date();d.setDate(d.getDate()+RULES.leadDays);return isoLocal(d)}
function orderIssues(r){const out=[];if(r.status==="excess")out.push({code:"CAPACITY",over:r.over});r.lines.forEach(l=>l.issues.filter(i=>i.lv==="err").forEach(i=>out.push({code:i.k.toUpperCase(),material:l.p.code})));return out}
const API={
  /* GET /api/v1/orders/:id */
  get(id){const o=S.orders.find(x=>x.id===id);if(!o)throw new ApiError(404,"Pedido não encontrado");return o},
  /* POST /api/v1/orders/quote: mesmo motor do servidor, sem gravar */
  quote(d){return calc(d.qty,d)},
  /* POST /api/v1/orders  (cabeçalho Idempotency-Key = draftId) */
  createOrder(d,meta){
    const dup=S.orders.find(o=>o.draftId&&o.draftId===meta.draftId); if(dup)return dup;
    const r=calc(d.qty,d), issues=orderIssues(r);
    if(!r.lines.length)throw new ApiError(422,"Pedido sem itens");
    if(issues.length)throw new ApiError(422,"Pedido com bloqueios",issues);
    if(meta.date&&meta.date<minDate())throw new ApiError(422,"Data de carregamento antes do prazo mínimo");
    const qty={};r.lines.forEach(l=>qty[l.p.code]=l.cx);
    const o={id:nextId(),draftId:meta.draftId,v:1,client:d.client,veh:d.veh,mode:d.mode,mixed:!!d.mixed,qty,ref:String(meta.ref||"").replace(/[;\r\n"\t]/g," ").trim().slice(0,30),date:meta.date||"",status:"analise",created:nowStamp(),createdMs:Date.now(),origin:"Portal",audit:[]};
    o.audit.push({...stamp(),who:actorClient(),what:`Pedido criado no portal com ${r.lines.length} itens e validado automaticamente (${T.pt["st_"+r.status].toLowerCase()}, ${fmtPT(r.maxU*100,0)}%)`});
    if(CLIENTS[d.client].autoApprove&&!r.blocking&&r.maxU>=RULES.fullAt){o.status="aprovado";o.vsnap=vsnapOf(o.veh);o.auto=true;o.approved=nowStamp();o.approvedMs=Date.now();o.v=2;o.audit.push({...stamp(),who:"Regra de aprovação automática",what:`Aprovado automaticamente: sem bloqueios e carga completa (${fmtPT(r.maxU*100,0)}%)`})}
    S.orders.unshift(o); save(); return o;
  },
  /* PATCH /api/v1/orders/:id/items/:material */
  updateItem(id,code,nv){
    const o=API.get(id); if(o.status!=="analise")throw new ApiError(409,"Só pedidos em análise podem ser alterados");
    nv=Math.max(0,Math.floor(nv||0)); const old=o.qty[code]||0; if(nv===old)return o;
    if(nv)o.qty[code]=nv; else delete o.qty[code];
    o.v=(o.v||1)+1; o.audit.push({...stamp(),who:ACTOR_EXP,kind:"edit",code,old,nv,what:`Alterou ${code} (${BY[code]?BY[code].pt:code}) de ${fmtPT(old,0)} para ${fmtPT(nv,0)} cx`});
    save(); return o;
  },
  /* POST /api/v1/orders/:id/approve */
  approve(id){
    const o=API.get(id); if(!FLOW[o.status].includes("aprovado"))throw new ApiError(409,"Este pedido não está em análise");
    const rr=calc(o.qty,o); if(!rr.lines.length)throw new ApiError(409,"O pedido está sem itens"); if(rr.blocking)throw new ApiError(409,"O pedido ainda tem bloqueios");
    const adj=adjCount(o); o.status="aprovado"; o.vsnap=vsnapOf(o.veh); o.approved=nowStamp(); o.approvedMs=Date.now(); o.v=(o.v||1)+1;
    o.audit.push({...stamp(),who:ACTOR_EXP,what:adj?`Pedido aprovado após ${adj} ajuste${adj>1?"s":""}`:"Pedido aprovado sem alterações"}); save(); return o;
  },
  /* POST /api/v1/orders/:id/sap-export */
  exportSap(id){
    const o=API.get(id); if(!FLOW[o.status].includes("sap"))throw new ApiError(409,"Aprove o pedido antes de gerar o arquivo para o SAP");
    if(o.status!=="sap"){o.status="sap";o.sapAt=nowStamp();o.v=(o.v||1)+1;o.audit.push({...stamp(),who:ACTOR_EXP,what:"Arquivo de importação para o SAP gerado"})}
    save(); return o;
  },
  /* PUT /api/v1/clients/:id/rules */
  setClientRule(k,field,val){
    if(!CLIENTS[k])throw new ApiError(404,"Cliente não encontrado"); if(!["mixed","autoApprove"].includes(field))throw new ApiError(400,"Regra desconhecida");
    CLIENTS[k][field]=!!val; RLOG.unshift({...stamp(),who:ACTOR_EXP,what:field==="mixed"?`${CLIENTS[k].name}: pallet misto ${val?"liberado":"não aceito"}`:`${CLIENTS[k].name}: aprovação automática ${val?"ativada":"desligada"}`}); save(); return CLIENTS[k];
  },
  /* GET /api/v1/settings */
  getSettings(){return {rules:{...RULES},vehicles:JSON.parse(JSON.stringify(VEH)),products:P.map(p=>({code:p.code,lastro:p.lastro,alt:p.alt,cxPal:p.cxPal,loteMin:p.loteMin,gross:p.gross,active:!p.off})),restrictions:Object.fromEntries(Object.entries(CLIENTS).map(([k,c])=>[k,[...c.blocked]]))}},
  /* PATCH /api/v1/settings: lote {caminho: valor}. Valida tudo antes de aplicar qualquer coisa (tudo ou nada) */
  saveSettings(ch){
    ch=ch||{};
    const errs=Object.entries(ch).map(([p,v])=>({field:p,msg:pvalidate(p,v)})).filter(x=>x.msg);
    if(errs.length)throw new ApiError(422,errs[0].msg,errs);
    const left=Object.keys(VEH).filter(k=>("veh."+k+".active") in ch?ch["veh."+k+".active"]:vehOn(k));
    if(!left.length)throw new ApiError(422,"Mantenha pelo menos um veículo disponível para os clientes");
    const done=[];
    Object.entries(ch).forEach(([p,v])=>{const old=pget(p);if(psame(old,v))return;pset(p,v);done.push({p,old,v})});
    done.forEach(x=>RLOG.unshift({...stamp(),who:ACTOR_EXP,kind:"param",what:pdesc(x)}));
    save(); return done;
  },
  /* POST /api/v1/settings/vehicles */
  addVehicle(d){
    const x={pt:String(d.pt||"").trim(),es:String(d.es||"").trim(),en:String(d.en||"").trim(),kind:d.kind==="container"?"container":"trailer",pos:d.pos,kg:d.kg,m3:d.m3};
    if(!x.es)x.es=x.pt; if(!x.en)x.en=x.pt;
    const errs=["pt","es","en","pos","kg","m3"].map(f=>({field:f,msg:pvalidate("veh.__new."+f,x[f])})).filter(e=>e.msg);
    if(x.pt&&Object.values(VEH).some(v=>nrm(v.pt)===nrm(x.pt)))errs.push({field:"pt",msg:"Já existe um veículo com esse nome"});
    if(errs.length)throw new ApiError(422,errs[0].msg,errs);
    let key="v-"+(nrm(x.pt).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24)||"veiculo"), i=2; while(VEH[key])key=key.replace(/-\d+$/,"")+"-"+(i++);
    VEH[key]={...x,cols:Math.ceil(x.pos/2),cab:x.kind==="trailer",active:true,custom:true};
    RLOG.unshift({...stamp(),who:ACTOR_EXP,kind:"param",what:`Novo veículo: ${x.pt} (${x.pos} posições, ${nf(x.kg)} kg, ${nf(x.m3)} m³)`}); save(); return key;
  },
  /* DELETE /api/v1/settings/vehicles/:id */
  removeVehicle(k){
    const x=VEH[k]; if(!x)throw new ApiError(404,"Veículo não encontrado");
    if(!x.custom)throw new ApiError(409,"Veículos padrão não podem ser excluídos. Retire de uso.");
    if(S.orders.some(o=>o.veh===k))throw new ApiError(409,"Veículo usado em pedidos. Retire de uso em vez de excluir.");
    delete VEH[k]; Object.keys(S.pd).forEach(p=>{if(p.startsWith("veh."+k+"."))delete S.pd[p]});
    RLOG.unshift({...stamp(),who:ACTOR_EXP,kind:"param",what:`Veículo excluído: ${x.pt}`}); save(); return true;
  },
  /* POST /api/v1/settings/reset {scope: rules | veh | prod | dest | all} */
  resetSettings(scope){
    const ch={}, all=scope==="all";
    if(all||scope==="rules")Object.keys(RULES_DEF).forEach(k=>{ch["rules."+k]=RULES_DEF[k]});
    if(all||scope==="veh")Object.keys(VEH_DEF).forEach(k=>{if(!VEH[k])return;["pos","kg","m3","pt","es","en"].forEach(f=>{ch[`veh.${k}.${f}`]=VEH_DEF[k][f]});ch[`veh.${k}.active`]=true});
    if(all||scope==="prod")P.forEach(p=>{const d=P_DEF[p.code];if(d)Object.entries(d).forEach(([f,v])=>{ch[`prod.${p.code}.${f}`]=v});ch[`prod.${p.code}.off`]=false});
    if(all||scope==="dest")Object.keys(CLIENTS).forEach(k=>P.forEach(p=>{ch[`block.${k}.${p.code}`]=(BLOCK_DEF[k]||[]).includes(p.code)}));
    const done=API.saveSettings(ch);
    if(all||scope==="veh")Object.keys(VEH).filter(k=>VEH[k].custom&&!S.orders.some(o=>o.veh===k)).forEach(k=>{API.removeVehicle(k);done.push({p:"veh."+k})});
    return done;
  }
};

/* ============ PERSISTÊNCIA LOCAL (sem servidor) ============ */
/* Guarda pedidos, carrinho e regras no navegador para o estado sobreviver a um recarregamento.
   Em produção, isso é o banco de dados. Se os dados-base do catálogo mudarem, o estado salvo é descartado. */
const STORE_KEY="3cc-v4";
const BASE_SIG=P.map(p=>p.code+":"+p.cxPal+":"+p.price+":"+p.gross).join("|");

function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify({v:2,base:BASE_SIG,orders:S.orders,qty:S.qty,unit:S.unit,veh:S.veh,mode:S.mode,lang:S.lang,client:S.client,view3d:S.view3d,rules:Object.fromEntries(Object.entries(CLIENTS).map(([k,c])=>[k,{mixed:!!c.mixed,autoApprove:!!c.autoApprove}])),fam:FAM,catalog:P,implog:IMP.log,rlog:RLOG.slice(0,80),drafts:S.drafts,draftId:S.draftId,vehicles:VEH,brules:RULES,blocked:Object.fromEntries(Object.entries(CLIENTS).map(([k,c])=>[k,c.blocked]))}))}catch(_){}},200)}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||d.v!==2||d.base!==BASE_SIG)return false;
    if(Array.isArray(d.orders)&&d.orders.every(o=>o&&o.id&&o.qty&&FLOW[o.status]))S.orders=d.orders;
    if(d.qty&&typeof d.qty==="object")S.qty=d.qty; if(d.unit&&typeof d.unit==="object")S.unit=d.unit;
    if(VEH[d.veh])S.veh=d.veh; if(d.mode==="pal"||d.mode==="est")S.mode=d.mode; if(T[d.lang])S.lang=d.lang; if(CLIENTS[d.client])S.client=d.client; if(d.view3d==="2d"||d.view3d==="3d")S.view3d=d.view3d;
    if(d.rules)Object.entries(d.rules).forEach(([k,x])=>{if(CLIENTS[k]){CLIENTS[k].mixed=!!(x&&x.mixed);CLIENTS[k].autoApprove=!!(x&&x.autoApprove)}});
    if(d.vehicles&&typeof d.vehicles==="object"){const ok=x=>x&&typeof x.pt==="string"&&[x.pos,x.kg,x.m3].every(n=>typeof n==="number"&&n>0);const nv=Object.entries(d.vehicles).filter(([k,x])=>ok(x));if(nv.length){Object.keys(VEH).forEach(k=>{if(!d.vehicles[k]&&!VEH_DEF[k])delete VEH[k]});nv.forEach(([k,x])=>{VEH[k]=Object.assign(VEH[k]||{},x)})}if(VEH[d.veh])S.veh=d.veh}
    if(Array.isArray(d.drafts)&&d.drafts.every(x=>x&&x.id&&x.client&&x.qty&&typeof x.qty==="object")){S.drafts=d.drafts;if(d.drafts.some(x=>x.id===d.draftId))S.draftId=d.draftId}
    if(d.brules&&typeof d.brules==="object")Object.keys(RULES_DEF).forEach(k=>{if(typeof d.brules[k]===typeof RULES_DEF[k])RULES[k]=d.brules[k]});
    if(d.blocked&&typeof d.blocked==="object")Object.entries(d.blocked).forEach(([k,a])=>{if(CLIENTS[k]&&Array.isArray(a))CLIENTS[k].blocked=a.filter(c=>typeof c==="string")});
    if(d.fam)Object.entries(d.fam).forEach(([k,x])=>{if(!FAM[k]&&x&&x.pt)FAM[k]=x});
    if(Array.isArray(d.catalog)&&d.catalog.length&&d.catalog.every(p=>p&&p.code&&p.lastro&&p.alt)){P.length=0;d.catalog.forEach(p=>P.push(p));Object.keys(BY).forEach(k=>delete BY[k]);P.forEach(p=>BY[p.code]=p)}
    if(Array.isArray(d.implog))IMP.log=d.implog; if(Array.isArray(d.rlog))RLOG.push(...d.rlog);
    S.sel=S.orders[0]?S.orders[0].id:null; return true;
  }catch(_){return false}
}

function setQty(code,v){const n=Math.max(0,Math.round((v||0)*1e6)/1e6);if(n<EPS)delete S.qty[code];else S.qty[code]=n}
function act(a){
  const [k,code,n]=a.split(":");
  if(k==="fill"){const n=fillLoad();render();toast(t("tFilled")(n));return}
  if(k==="veh"&&VEH[code])S.veh=code;
  if(k==="round"){for(const p of P){const q=S.qty[p.code];if(q&&q%p.cxPal)S.qty[p.code]=Math.ceil(q/p.cxPal)*p.cxPal}}
  if(k==="add")setQty(code,(S.qty[code]||0)+Number(n)*BY[code].cxPal);
  if(k==="cut"){const p=BY[code];setQty(code,Math.max(0,Math.ceil(S.qty[code]/p.cxPal-EPS)-Number(n))*p.cxPal)}
  render();toast(t("tApplied"));
}

/* Modal sheets: focus moves in when they open, Tab stays inside, focus goes back to the control that opened them */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let ovReturn=null;
function trapFocus(e,root){const f=[...root.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null||x===document.activeElement);if(!f.length){e.preventDefault();return}const a=f[0],z=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||!root.contains(document.activeElement))){e.preventDefault();z.focus()}else if(!e.shiftKey&&(document.activeElement===z||!root.contains(document.activeElement))){e.preventDefault();a.focus()}}
new MutationObserver(()=>{const ov=document.getElementById("overlay");
  if(ov.hidden){mount3D();document.body.classList.remove("ov-open");const r=ovReturn;ovReturn=null;if(r&&r.isConnected&&r.offsetParent!==null)r.focus({preventScroll:true});else{const h=document.querySelector("#v-"+S.view+" h1");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}}
  else{document.body.classList.add("ov-open");if(!ovReturn)ovReturn=document.activeElement;setTimeout(()=>{if(ov.hidden)return;if(!ov.contains(document.activeElement)){const x=ov.querySelector(".sheet [data-close-ov]")||ov.querySelector(FOCUSABLE);if(x)x.focus()}},40)}
}).observe(document.getElementById("overlay"),{attributes:true,attributeFilter:["hidden"]});

document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop,#impDrop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop,#impDrop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop,#impDrop");if(d){e.preventDefault();if(d.id==="impDrop"){const f=e.dataTransfer.files[0];if(f)readOrderFile(f)}else readFiles([...e.dataTransfer.files])}});
document.addEventListener("change",e=>{
  if(e.target.id==="palSel"){S.palCode=e.target.value;render();return}
  if(e.target.dataset&&e.target.dataset.pset){pChanged(e.target);return}
  if(e.target.id==="sapFiles"){readFiles([...e.target.files]);return}
  if(e.target.id==="impFile"){const f=e.target.files&&e.target.files[0];if(f)readOrderFile(f);return}
  if(e.target.dataset.photo){const c=e.target.dataset.photo,f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{IMG[c]=rd.result;delete IMGNOTE[c];render();toast("Foto atualizada: "+BY[c].pt)};rd.readAsDataURL(f);return}
  if(e.target.id==="draftSel"){useDraft(e.target.value);render();return}
  if(e.target.dataset&&e.target.dataset.dname){const d=S.drafts.find(x=>x.id===e.target.dataset.dname),v=String(e.target.value).trim().slice(0,40);if(d&&v){d.name=v;render();toast(tr("Nome do rascunho salvo","Nombre del borrador guardado","Draft name saved"))}else render();return}
  if(e.target.dataset&&e.target.dataset.tbf){const [id,k]=e.target.dataset.tbf.split(":"),st=tbState(id);st.f[k]=e.target.value;st.page=1;render();return}
  if(e.target.dataset&&e.target.dataset.tbsize){const st=tbState(e.target.dataset.tbsize);st.size=+e.target.value;st.page=1;render();return}
  if(e.target.id==="kCli"){S.kcli=e.target.value;render();return}
  if(e.target.id==="clientSel"){S.client=e.target.value;S.lang=CLIENTS[S.client].lang||S.lang;render();return}
  if(e.target.dataset.autoclient){const k=e.target.dataset.autoclient;try{API.setClientRule(k,"autoApprove",e.target.checked);toast(`${CLIENTS[k].name}: aprovação automática ${e.target.checked?"ativada":"desligada"}`)}catch(err){toast(err.message,"err")}render();return}
  if(e.target.dataset.mixclient){const k=e.target.dataset.mixclient;try{API.setClientRule(k,"mixed",e.target.checked);toast(`${CLIENTS[k].name}: pallet misto ${e.target.checked?"liberado":"não aceito"}`)}catch(err){toast(err.message,"err")}render();return}
  if(e.target.dataset.q){const c=e.target.dataset.q;const p=BY[c];setQty(c,parseNum(e.target.value)/UF[unitOf(c)](p));render();return}
  if(e.target.dataset.edit){const code=e.target.dataset.edit;const nv=parseInt(String(e.target.value).replace(/\D/g,""),10)||0;let changed=false;try{const o=API.get(S.sel);changed=(o.qty[code]||0)!==nv;API.updateItem(S.sel,code,nv)}catch(err){toast(err.message,"err");changed=false}render();if(changed)toast("Alteração registrada na auditoria");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&(e.target.dataset.q||e.target.dataset.edit||e.target.dataset.pset||e.target.dataset.dname))e.target.blur();if(e.key==="Escape"){const ov=document.getElementById("overlay");if(!ov.hidden)ov.hidden=true;else if(CHAT.open)chatOpen(false)}});
document.addEventListener("submit",e=>{if(e.target.matches&&e.target.matches("form[data-login]")){e.preventDefault();doLogin(e.target);return}if(e.target.id!=="chatForm")return;e.preventDefault();const i=document.getElementById("chatIn"),q=i.value.trim();if(!q||CHAT.busy)return;i.value="";chatAsk(q,false)});
render();
aiInit();
/* Fotos da pasta assets/produtos: um arquivo com o código SAP no nome substitui a foto embutida */
function loadFolderPhotos(){return Promise.all(P.map(p=>new Promise(done=>{const exts=["jpg","png","webp"];const tryExt=i=>{if(i>=exts.length)return done();const url=`assets/produtos/${p.code}.${exts[i]}`;const im=new Image();im.onload=()=>{IMG[p.code]=url;delete IMGNOTE[p.code];done()};im.onerror=()=>tryExt(i+1);im.src=url};tryExt(0)}))).then(()=>{if(S.area)render()})}
</script>
<script src="assets/pallet3d.js"></script>
</body>
</html>
